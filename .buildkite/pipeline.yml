# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# TEMPORARY: Stripped-down pipeline for Azure Trusted Signing iteration.
# Only runs the Windows dev build (x64) to test code signing changes.
# Restore the full pipeline before merging to trunk.

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: 🔨 Windows Dev Build - Azure Trusted Signing
    agents:
      queue: windows
    command: powershell -File .buildkite/commands/build-for-windows.ps1 -BuildType dev -Architecture x64
    artifact_paths:
      - out\**\studio-setup.exe
      - out\**\studio-update.nupkg
      - out\**\RELEASES
      - out\**\*.appx
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    notify:
      - github_commit_status:
          context: Windows Dev Build
