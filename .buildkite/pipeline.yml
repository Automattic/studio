# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# IMAGE_ID is an env var that only macOS agents need.
# Defining it at the root level propagates it too all agents, which can seem unnecessary but is a the same time convenient and DRY.
env:
  IMAGE_ID: $IMAGE_ID

e2e_config: &e2e_config
  timeout_in_minutes: 100
  command: bash .buildkite/commands/run-e2e-tests.sh "{{matrix.platform}}" "{{matrix.arch}}"
  artifact_paths:
    - test-results/**/*.zip
    - test-results/**/*.png
    - test-results/**/*error-context.md
    - test-results/daemon-logs/**/*.log
  plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
  agents:
    queue: "{{matrix.platform}}"
  env:
    # See https://playwright.dev/docs/ci#debugging-browser-launches
    DEBUG: "pw:browser"
  matrix:
    setup: { platform: [], arch: [] }
    adjustments:
      - with: { platform: mac, arch: arm64 }
      - with: { platform: windows, arch: x64 }

steps:
  - label: Lint
    agents:
      queue: mac
    key: lint
    command: bash .buildkite/commands/run-lint.sh
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    notify:
      - github_commit_status:
          context: Lint

  - label: Data Liberation
    agents:
      queue: mac
    key: data-liberation
    command: bash .buildkite/commands/run-data-liberation-checks.sh
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    notify:
      - github_commit_status:
          context: Data Liberation

  - label: ":fastlane: fastlane Helper Tests"
    agents:
      queue: default
    key: fastlane_tests
    command: bash .buildkite/commands/run-fastlane-tests.sh
    plugins:
      - $DOCKER_PLUGIN:
          image: "$RUBY_DOCKER_IMAGE"
          propagate-environment: true
          mount-buildkite-agent: true
    notify:
      - github_commit_status:
          context: fastlane Helper Tests

  - group: Unit Tests
    key: unit-tests
    steps:
      - label: Unit Tests on {{matrix}}
        key: unit_tests
        command: bash .buildkite/commands/run-unit-tests.sh "{{matrix}}"
        plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
        agents:
          queue: "{{matrix}}"
        matrix:
          - mac
          - windows
        notify:
          - github_commit_status:
              context: Unit Tests

      # Linux unit tests run on the shared `default` queue inside a Debian Node
      # container — the same pattern the Linux build group uses. Kept as a
      # separate step (rather than another matrix entry above) because Mac and
      # Windows share queue/plugin defaults that Linux doesn't.
      - label: Unit Tests on linux
        key: unit_tests_linux
        command: bash .buildkite/commands/run-unit-tests.sh "linux"
        agents:
          queue: default
        plugins:
          - $DOCKER_PLUGIN:
              image: "$NODE_DOCKER_IMAGE"
              propagate-environment: true
              mount-buildkite-agent: true
        notify:
          - github_commit_status:
              context: Unit Tests

  - group: E2E Tests
    key: e2e-tests
    notify:
      - github_commit_status:
          context: E2E Tests
    steps:
      # E2E tests run on supported platform/architecture combinations.
      # - mac-arm64: Native on Apple Silicon agents
      # - windows-x64: Native on x64 agents
      - <<: *e2e_config
        label: E2E Tests on {{matrix.platform}}-{{matrix.arch}}
        key: e2e_tests
        if: (build.branch == 'trunk' || build.tag =~ /^v[0-9]+/ || !build.pull_request.draft) && !(build.pull_request.labels includes 'native-php')

      # Linux E2E tests run on the shared `default` queue inside a Debian Node
      # container — the same pattern the Linux build/unit-test steps use. Kept as
      # a separate step (rather than another matrix entry on *e2e_config) because
      # Mac and Windows share queue/plugin defaults that Linux doesn't.
      - label: E2E Tests on linux-x64
        key: e2e_tests_linux
        command: bash .buildkite/commands/run-e2e-tests.sh "linux" "x64"
        agents:
          queue: default
        plugins:
          - $DOCKER_PLUGIN:
              image: "$NODE_DOCKER_IMAGE"
              propagate-environment: true
              mount-buildkite-agent: true
        artifact_paths:
          - test-results/**/*.zip
          - test-results/**/*.png
          - test-results/**/*error-context.md
          - test-results/daemon-logs/**/*.log
        env:
          DEBUG: "pw:browser"
        if: (build.branch == 'trunk' || build.tag =~ /^v[0-9]+/ || !build.pull_request.draft) && !(build.pull_request.labels includes 'native-php')

  # No `if:` guard: a required status check must report on every build, or PRs
  # that skip it hang waiting for it. Doc-only PRs exit early but still report.
  - group: CLI E2E Tests
    key: cli-e2e-tests
    notify:
      - github_commit_status:
          context: CLI E2E Tests
    steps:
      - label: CLI E2E Tests on {{matrix}}
        key: cli_e2e_tests_mac_windows
        command: bash .buildkite/commands/run-cli-e2e-tests.sh "{{matrix}}"
        agents:
          queue: "{{matrix}}"
        timeout_in_minutes: 30
        plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
        matrix:
          - mac
          - windows

      # Separate from the matrix above: Mac and Windows share queue/plugin
      # defaults that Linux doesn't. Same pattern as the unit-test group.
      - label: CLI E2E Tests on linux
        key: cli_e2e_tests_linux
        command: bash .buildkite/commands/run-cli-e2e-tests.sh "linux"
        agents:
          queue: default
        timeout_in_minutes: 30
        plugins:
          - $DOCKER_PLUGIN:
              image: "$NODE_DOCKER_IMAGE"
              propagate-environment: true
              mount-buildkite-agent: true

  - label: ":chart_with_upwards_trend: Performance Metrics"
    key: metrics
    agents:
      queue: mac
    command: bash .buildkite/commands/run-metrics-tests.sh
    artifact_paths:
      - tools/metrics/artifacts/**/*.json
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    # Run this on `trunk` + non-draft PRs targeting `trunk` or `release/`.
    # Note: this job is set as a *required* CI check on GitHub for PRs targeting `trunk`. But the branch
    # protection settings set on `trunk` are _also_ copied to `release/` branch during `code_freeze`.
    # That's why this jobs has to _also_ run on PRs targeting `release/`, not just `trunk`—otherwise the
    # corresponding required CI check would never report on `release/` PRs and block them from merging.
    if: build.branch == 'trunk' || ((build.pull_request.base_branch == 'trunk' || build.pull_request.base_branch =~ /^release\//) && !build.pull_request.draft)
    notify:
      - github_commit_status:
          context: Performance Metrics

  - input: "🚦 Build for Mac?"
    prompt: "Do you want to build Mac dev binaries for this PR?"
    key: input-dev-mac
    if: build.tag !~ /^v[0-9]+/ && build.branch != 'trunk'

  - group: 📦 Build for Mac
    key: dev-mac
    depends_on: input-dev-mac
    if: build.tag !~ /^v[0-9]+/
    steps:
      - label: 🔨 Mac Dev Build - {{matrix}}
        agents:
          queue: mac
        command: |
          .buildkite/commands/prepare-environment.sh

          .buildkite/commands/install-node-dependencies.sh

          node ./scripts/prepare-dev-build-version.mjs

          export IS_DEV_BUILD=true

          echo "--- :node: Building Binary"
          npm run make:macos-{{matrix}}

          # Local trial and error show this needs to run before the DMG generation (obviously) but after the binary has been built
          echo "--- :hammer: Rebuild fs-attr if necessary before generating DMG"
          case {{matrix}} in
            x64)
              echo "Rebuilding fs-xattr for {{matrix}} architecture"
              npm rebuild fs-xattr --cpu universal
              ;;
            arm64)
              echo "No need to rebuild fs-xattr because it works out of the box on Apple Silicon"
              ;;
            *)
              echo "^^^ +++ Unexpected architecture {{matrix}}"
              exit 1
              ;;
          esac

          echo "--- :node: Packaging in DMG"
          npm run make:dmg-{{matrix}}

          echo "--- 📃 Notarizing Binary"
          bundle exec fastlane notarize_binary

          echo "--- :package: Building standalone CLI bundle"
          npm run cli:bundle -- darwin {{matrix}}
        plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
        artifact_paths:
          - apps/studio/out/**/*.app.zip
          - apps/studio/out/*.dmg
          - standalone-bundles/studio-cli-*.tgz
          - standalone-bundles/studio-cli-*.tgz.sha256
        matrix:
          - x64
          - arm64

  - input: "🚦 Build for Windows?"
    prompt: "Do you want to build Windows dev binaries for this PR?"
    key: input-dev-windows
    if: build.tag !~ /^v[0-9]+/ && build.branch != 'trunk'

  - group: 📦 Build for Windows
    key: dev-windows
    depends_on: input-dev-windows
    if: build.tag !~ /^v[0-9]+/
    steps:
      - label: 🔨 Windows Dev Build - {{matrix}}
        agents:
          queue: windows
        env:
          SIGN_WINDOWS_BUILD: 1
        command: powershell -File .buildkite/commands/build-for-windows.ps1 -BuildType dev -Architecture {{matrix}}
        artifact_paths:
          - apps\studio\out\**\studio-setup.exe
          - apps\studio\out\**\studio-update.nupkg
          - apps\studio\out\**\RELEASES
          - apps\studio\out\**\*.appx
          - standalone-bundles\studio-cli-*.tgz
          - standalone-bundles\studio-cli-*.tgz.sha256
        plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
        matrix:
          - x64
          - arm64

  # Optional manual trigger to run the agent eval on a PR. On scheduled builds
  # (and EVAL_PIPELINE runs) this gate is skipped — a skipped dependency counts
  # as passed — so the eval below runs automatically. On a PR it shows a button
  # to opt in.
  - input: ":test_tube: Run agent eval?"
    prompt: "Run the Studio Code agent evaluation for this PR?"
    key: input-eval
    if: build.source != 'schedule' && build.env('EVAL_PIPELINE') != 'true' && build.branch != 'trunk' && build.tag !~ /^v[0-9]+/

  # Agent evaluation. Runs automatically on the daily schedule (or with
  # EVAL_PIPELINE=true), and optionally on a PR via the gate above.
  # Setup details in scripts/eval/README.md.
  - label: ":test_tube: Agent Evaluation"
    key: agent_eval
    depends_on: input-eval
    agents:
      queue: mac
    command: bash .buildkite/commands/run-eval.sh
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    artifact_paths:
      - scripts/eval/results.json
    timeout_in_minutes: 25
    if: build.source == 'schedule' || build.env('EVAL_PIPELINE') == 'true' || (build.branch != 'trunk' && build.tag !~ /^v[0-9]+/)

  - input: "🚦 Build for Linux?"
    prompt: "Do you want to build Linux dev binaries for this PR?"
    key: input-dev-linux
    if: build.tag !~ /^v[0-9]+/ && build.branch != 'trunk'

  - group: 📦 Build for Linux
    key: dev-linux
    depends_on: input-dev-linux
    if: build.tag !~ /^v[0-9]+/
    steps:
      - label: 🔨 Linux Dev Build - {{matrix}}
        agents:
          queue: default
        command: |
          set -eu

          # The container has no SSH keys / known_hosts, use anonymous HTTPS
          git remote set-url origin https://github.com/Automattic/studio.git

          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends fakeroot

          # `--maxsockets 1` works around npm/cli#4652 (ECONNRESETs on Linux);
          # see install-node-dependencies.sh for the original rationale.
          # TODO: restore the Buildkite npm cache used on Mac/Windows. The
          # toolkit's cache helpers live on the host, so wiring them around a
          # Docker step needs extra plumbing or a persistent agent volume.
          npm ci --unsafe-perm --no-audit --no-progress --maxsockets 1

          node ./scripts/prepare-dev-build-version.mjs

          export IS_DEV_BUILD=true

          echo "--- :node: Building DEB"
          npm run make:linux-{{matrix}}

          echo "--- :package: Building standalone CLI bundle"
          npm run cli:bundle -- linux {{matrix}}
        artifact_paths:
          - apps/studio/out/make/deb/**/*.deb
          - standalone-bundles/studio-cli-*.tgz
          - standalone-bundles/studio-cli-*.tgz.sha256
        plugins:
          # Amazon Linux on the `default` queue lacks `dpkg`/`fakeroot`
          # required by electron-forge's MakerDeb, so we build inside a
          # Debian container that has them. Image tag is derived from
          # `.nvmrc` (see shared-pipeline-vars) so Linux drifts in lockstep
          # with the Mac/Windows agents (which install Node via NVM).
          - $DOCKER_PLUGIN:
              image: "$NODE_DOCKER_IMAGE"
              propagate-environment: true
              mount-buildkite-agent: true
        matrix:
          - x64
          - arm64

  - label: ":rocket: Distribute Dev Builds"
    command: |
      echo "--- :node: Downloading Binaries"
      buildkite-agent artifact download "*.app.zip" .
      buildkite-agent artifact download "*.dmg" .
      buildkite-agent artifact download "*.exe" .
      buildkite-agent artifact download "*.appx" .
      buildkite-agent artifact download "*.nupkg" .
      buildkite-agent artifact download "*\\RELEASES" .
      buildkite-agent artifact download "*.deb" .
      buildkite-agent artifact download "*.tgz" .
      buildkite-agent artifact download "*.tgz.sha256" .

      .buildkite/commands/install-node-dependencies.sh

      export IS_DEV_BUILD=true

      echo "--- :node: Generating Release Manifest"
      node ./scripts/prepare-dev-build-version.mjs

      echo "--- :fastlane: Distributing Dev Builds"
      install_gems
      bundle exec fastlane distribute_dev_build
    agents:
      queue: mac
    depends_on:
      - step: dev-mac
      - step: dev-windows
      - step: dev-linux
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    if: build.branch == 'trunk' && build.tag !~ /^v[0-9]+/
    notify:
      - github_commit_status:
          context: Distribute Dev Builds
