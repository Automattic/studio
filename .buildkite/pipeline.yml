# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# IMAGE_ID is an env var that only macOS agents need.
# Defining it at the root level propagates it too all agents, which can seem unnecessary but is a the same time convenient and DRY.
env:
  IMAGE_ID: $IMAGE_ID

# TEMP(rsm-2593): pipeline trimmed to only the Linux E2E job while iterating
# on the Linux harness. Restore the full pipeline (Lint, Unit Tests, Mac/Windows
# E2E, Performance Metrics, dev-build groups, Distribute) before merge.
steps:
  # Linux E2E tests run on the shared `default` queue inside a Debian Node
  # container — the same pattern the Linux build/unit-test steps use. Kept as
  # a separate step (rather than another matrix entry on *e2e_config) because
  # Mac and Windows share queue/plugin defaults that Linux doesn't.
  - label: E2E Tests on linux-x64
    key: e2e_tests_linux
    command: bash .buildkite/commands/run-e2e-tests.sh "linux" "x64"
    agents:
      queue: default
    plugins:
      - $DOCKER_PLUGIN:
          image: "$NODE_DOCKER_IMAGE"
          propagate-environment: true
          mount-buildkite-agent: true
    artifact_paths:
      - test-results/**/*.zip
      - test-results/**/*.png
      - test-results/**/*error-context.md
    env:
      DEBUG: "pw:browser"
    # TEMP(rsm-2593): if: removed to force E2E on every push while iterating on Linux E2E setup. Revert before merge.
    notify:
      - github_commit_status:
          context: E2E Tests
