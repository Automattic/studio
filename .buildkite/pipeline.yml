# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---
steps:
  - label: 'Windows plugin-heavy startup comparison (STU-1622)'
    key: windows-startup-probe
    agents:
      queue: windows
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    timeout_in_minutes: 40
    env:
      STARTUP_PROBE_REQUIRE_WINDOWS: '1'
      STARTUP_PROBE_PRODUCTS: '5000'
    command: |
      bash .buildkite/commands/install-node-dependencies.sh
      node tools/startup-probe/build.mjs
      node apps/cli/dist/startup-probe/draft/main.mjs site list
      node tools/startup-probe/run.mjs
    artifact_paths:
      - test-results/startup-probe/**/*
