# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# IMAGE_ID is an env var that only macOS agents need.
# Defining it at the root level propagates it too all agents, which can seem unnecessary but is a the same time convenient and DRY.
env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: Windows Unit Tests
    command: |
      # prepare_windows_host_for_app_distribution.ps1 comes from CI Toolkit Plugin
      & "prepare_windows_host_for_app_distribution.ps1" -InstallPython $true -InstallNativeCompilationTools $true

      bash .buildkite/commands/install-node-dependencies.sh
      echo '--- :npm: Run Unit Tests'
      npm run test
    agents:
      queue: windows-staging
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    notify:
      - github_commit_status:
          context: Windows Unit Tests

  - group: 📦 Build for Windows
    key: dev-windows
    steps:
      - label: 🔨 Windows Dev Build - {{matrix}}
        agents:
          queue: windows-staging
        command: powershell -File .buildkite/commands/build-for-windows.ps1 -BuildType dev -Architecture {{matrix}}
        artifact_paths:
          - out\**\studio-setup.exe
          - out\**\studio-update.nupkg
          - out\**\RELEASES
          - out\**\*.appx
        plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
        matrix:
          - x64
          - arm64
        notify:
          - github_commit_status:
              context: All Windows Dev Builds
    if: build.tag !~ /^v[0-9]+/
