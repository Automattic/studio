# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# IMAGE_ID is an env var that only macOS agents need.
# Defining it at the root level propagates it too all agents, which can seem unnecessary but is a the same time convenient and DRY.
env:
  IMAGE_ID: $IMAGE_ID

# TEMPORARY: Lint-only pipeline to validate the default-queue move without adding mac load. Revert before merge.
steps:
  - label: Lint
    agents:
      queue: default
    key: lint
    command: bash .buildkite/commands/run-lint.sh
    plugins:
      - $DOCKER_PLUGIN:
          image: "$NODE_DOCKER_IMAGE"
          propagate-environment: true
          mount-buildkite-agent: true
    notify:
      - github_commit_status:
          context: Lint
