# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# Publishes the wp-studio npm package as part of the Releases V2 workflow.
#
# Expects:
#   - RELEASE_VERSION: The release version (e.g., '1.7.4')
#   - NPM_TAG (optional): npm dist-tag (e.g., 'next' for prereleases, empty for 'latest')
---

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":npm: Publish npm Package"
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    command: |
      .buildkite/commands/checkout-release-branch.sh "${RELEASE_VERSION}"

      .buildkite/commands/publish-npm-package.sh
    agents:
      queue: mac
    retry:
      manual:
        reason: If release jobs fail, you should always re-trigger the task from Releases V2 rather than retrying the individual job from Buildkite
        allowed: false
