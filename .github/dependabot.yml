# See the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dependabot only opens security update PRs here. `open-pull-requests-limit: 0`
# disables scheduled version updates while keeping the rest of each block
# (e.g. `ignore`) applied to security updates. A `schedule` is still required.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "eslint-plugin-studio"
      - dependency-name: "winreg" # v1.2.5 has a known issue: https://github.com/fresc81/node-winreg/issues/65
      - dependency-name: "@types/glob" # glob@7 (transitive) has no bundled types; @types/glob@9 is a stub for glob@9+ only
      - dependency-name: "@wp-playground/*" # must be pinned exactly and bumped manually in lockstep — mismatched versions install duplicate nested copies
      - dependency-name: "@php-wasm/*" # pulled in by @wp-playground/blueprints; bumped together with it

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
