name: Build PHP CLI Binaries

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP patch version to build
        required: true
        default: 8.4.20
      xdebug_version:
        description: Xdebug version to package
        required: true
        default: 3.5.1
      debug:
        description: Enable verbose build logs
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
            artifact_platform: macos
            artifact_arch: aarch64
            archive_extension: tar.gz
            binary_name: php
          - target: macos-x86_64
            runner: macos-15-intel
            artifact_platform: macos
            artifact_arch: x86_64
            archive_extension: tar.gz
            binary_name: php
          - target: windows-x86_64
            runner: windows-latest
            artifact_platform: windows
            artifact_arch: x86_64
            archive_extension: zip
            binary_name: php.exe
    env:
      PHP_VERSION: ${{ inputs.php_version }}
      XDEBUG_VERSION: ${{ inputs.xdebug_version }}
      PHP_CLI_ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
      PHP_CLI_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      PHP_CLI_ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
      PHP_CLI_BINARY_NAME: ${{ matrix.binary_name }}
      BUILD_DEBUG: ${{ inputs.debug }}

    steps:
      - name: Checkout Studio
        uses: actions/checkout@v6

      - name: Validate PHP version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PHP_VERSION" =~ ^8\.(2|3|4|5)\.[0-9]+$ ]]; then
            echo "Unsupported PHP version: $PHP_VERSION" >&2
            echo "Supported PHP minors: 8.2, 8.3, 8.4, 8.5" >&2
            exit 1
          fi

          php_minor="${PHP_VERSION%.*}"
          echo "PHP_MINOR=$php_minor" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install \
            autoconf \
            bison \
            bzip2 \
            curl \
            freetype \
            gettext \
            icu4c \
            jpeg-turbo \
            libiconv \
            libpng \
            libxml2 \
            libzip \
            oniguruma \
            openssl@3 \
            pkg-config \
            re2c \
            sqlite \
            zlib

      - name: Build PHP runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$BUILD_DEBUG" = "true" ]; then
            set -x
          fi

          source_url="https://www.php.net/distributions/php-${PHP_VERSION}.tar.gz"
          xdebug_url="https://xdebug.org/files/xdebug-${XDEBUG_VERSION}.tgz"
          work_dir="$RUNNER_TEMP/php-build"
          install_dir="$RUNNER_TEMP/php-install"
          staging_dir="$RUNNER_TEMP/php-artifact"

          rm -rf "$work_dir" "$install_dir" "$staging_dir"
          mkdir -p "$work_dir" "$install_dir" "$staging_dir/ext"

          curl --fail --location --retry 3 "$source_url" --output "$work_dir/php.tar.gz"
          tar -xzf "$work_dir/php.tar.gz" -C "$work_dir"

          export PATH="$(brew --prefix bison)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libzip)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix bzip2)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPPFLAGS="-I$(brew --prefix libiconv)/include -I$(brew --prefix gettext)/include -I$(brew --prefix bzip2)/include -I$(brew --prefix zlib)/include ${CPPFLAGS:-}"
          export LDFLAGS="-L$(brew --prefix libiconv)/lib -L$(brew --prefix gettext)/lib -L$(brew --prefix bzip2)/lib -L$(brew --prefix zlib)/lib ${LDFLAGS:-}"

          cd "$work_dir/php-${PHP_VERSION}"
          ./buildconf --force
          ./configure \
            --prefix="$install_dir" \
            --with-config-file-path="$install_dir" \
            --with-config-file-scan-dir="$install_dir/conf.d" \
            --disable-cgi \
            --disable-debug \
            --disable-phpdbg \
            --enable-bcmath=shared \
            --enable-calendar=shared \
            --enable-cli \
            --enable-ctype=shared \
            --enable-dom=shared \
            --enable-exif=shared \
            --enable-fileinfo=shared \
            --enable-filter=shared \
            --enable-gd=shared \
            --enable-intl=shared \
            --enable-mbstring=shared \
            --enable-opcache=shared \
            --enable-pdo=shared \
            --enable-phar=shared \
            --enable-session=shared \
            --enable-simplexml=shared \
            --enable-tokenizer=shared \
            --enable-xml=shared \
            --enable-xmlreader=shared \
            --enable-xmlwriter=shared \
            --with-bz2=shared,$(brew --prefix bzip2) \
            --with-curl=shared \
            --with-freetype \
            --with-iconv=shared,$(brew --prefix libiconv) \
            --with-jpeg \
            --with-mysqli=shared,mysqlnd \
            --with-openssl=shared \
            --with-pdo-mysql=shared,mysqlnd \
            --with-pdo-sqlite=shared \
            --with-sqlite3=shared \
            --with-zip=shared \
            --with-zlib=shared,$(brew --prefix zlib)

          make -j"$(sysctl -n hw.ncpu)"
          make install

          curl --fail --location --retry 3 "$xdebug_url" --output "$work_dir/xdebug.tgz"
          tar -xzf "$work_dir/xdebug.tgz" -C "$work_dir"
          xdebug_source="$(find "$work_dir" -maxdepth 1 -type d -name 'xdebug-*' | head -n 1)"

          cd "$xdebug_source"
          "$install_dir/bin/phpize"
          ./configure --with-php-config="$install_dir/bin/php-config"
          make -j"$(sysctl -n hw.ncpu)"
          make install

          extension_dir="$("$install_dir/bin/php" -r 'echo ini_get("extension_dir");')"
          cp "$install_dir/bin/php" "$staging_dir/php"
          chmod +x "$staging_dir/php"
          cp "$extension_dir"/*.so "$staging_dir/ext/"

          bundle_macos_dependencies() {
            local queue_file="$work_dir/dylib-queue.txt"
            local seen_file="$work_dir/dylib-seen.txt"
            local dep dep_base dep_dest file replacement

            : > "$queue_file"
            : > "$seen_file"
            mkdir -p "$staging_dir/lib"

            printf '%s\n' "$staging_dir/php" "$staging_dir"/ext/*.so >> "$queue_file"

            while [ -s "$queue_file" ]; do
              file="$(head -n 1 "$queue_file")"
              tail -n +2 "$queue_file" > "$queue_file.tmp"
              mv "$queue_file.tmp" "$queue_file"

              otool -L "$file" | awk 'NR > 1 { print $1 }' | while read -r dep; do
                case "$dep" in
                  /opt/homebrew/*|/usr/local/*)
                    if grep -Fxq "$dep" "$seen_file"; then
                      continue
                    fi

                    if [ ! -f "$dep" ]; then
                      echo "Required dependency not found: $dep" >&2
                      exit 1
                    fi

                    dep_base="$(basename "$dep")"
                    dep_dest="$staging_dir/lib/$dep_base"
                    echo "$dep" >> "$seen_file"
                    cp -L "$dep" "$dep_dest"
                    chmod u+w "$dep_dest"
                    echo "$dep_dest" >> "$queue_file"
                    ;;
                esac
              done
            done

            for file in "$staging_dir/php" "$staging_dir"/ext/*.so "$staging_dir"/lib/*.dylib; do
              [ -e "$file" ] || continue

              case "$file" in
                "$staging_dir/php")
                  replacement='@loader_path/lib'
                  ;;
                "$staging_dir"/ext/*)
                  replacement='@loader_path/../lib'
                  ;;
                "$staging_dir"/lib/*)
                  replacement='@loader_path'
                  install_name_tool -id "@loader_path/$(basename "$file")" "$file"
                  ;;
              esac

              otool -L "$file" | awk 'NR > 1 { print $1 }' | while read -r dep; do
                case "$dep" in
                  /opt/homebrew/*|/usr/local/*)
                    install_name_tool -change "$dep" "$replacement/$(basename "$dep")" "$file"
                    ;;
                esac
              done
            done
          }

          bundle_macos_dependencies
          for file in "$staging_dir/php" "$staging_dir"/ext/*.so "$staging_dir"/lib/*.dylib; do
            [ -e "$file" ] || continue
            if otool -L "$file" | grep -E '/opt/homebrew/|/usr/local/'; then
              echo "Found non-portable Homebrew dependency in $file" >&2
              exit 1
            fi
          done

          xattr -cr "$staging_dir"
          for file in "$staging_dir"/lib/*.dylib "$staging_dir"/ext/*.so "$staging_dir/php"; do
            [ -e "$file" ] || continue
            if file "$file" | grep -q 'Mach-O'; then
              codesign --force --sign - "$file"
              codesign --verify --strict "$file"
            fi
          done

          cat > "$staging_dir/runtime.json" <<JSON
          {
            "phpVersion": "$PHP_VERSION",
            "phpMinor": "$PHP_MINOR",
            "threadSafety": "nts",
            "platform": "$PHP_CLI_ARTIFACT_PLATFORM",
            "arch": "$PHP_CLI_ARTIFACT_ARCH",
            "binary": "php",
            "extensionDir": "ext",
            "libraryDir": "lib",
            "xdebug": "ext/xdebug.so"
          }
          JSON

          "$staging_dir/php" -n \
            -d "extension_dir=$staging_dir/ext" \
            -d "zend_extension=$staging_dir/ext/xdebug.so" \
            -d "xdebug.mode=debug" \
            --ri xdebug

          "$staging_dir/php" -n \
            -d "extension_dir=$staging_dir/ext" \
            -d "extension=curl" \
            -d "extension=gd" \
            -d "extension=mbstring" \
            -d "extension=pdo" \
            -d "extension=pdo_sqlite" \
            -d "extension=sqlite3" \
            -r 'echo PHP_VERSION, PHP_EOL;'

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          out_dir="$GITHUB_WORKSPACE/out/php-binaries"
          staging_dir="$RUNNER_TEMP/php-artifact"
          artifact="php-${PHP_VERSION}-cli-${PHP_CLI_ARTIFACT_PLATFORM}-${PHP_CLI_ARTIFACT_ARCH}.${PHP_CLI_ARCHIVE_EXTENSION}"

          mkdir -p "$out_dir"
          tar -czf "$out_dir/$artifact" -C "$staging_dir" .
          shasum -a 256 "$out_dir/$artifact" | awk '{print $1}' > "$out_dir/$artifact.sha256"

      - name: Resolve Windows runtime metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $phpMinor = $env:PHP_MINOR
          switch ( $phpMinor ) {
            '8.2' { $vsVersion = 'vs16' }
            '8.3' { $vsVersion = 'vs16' }
            '8.4' { $vsVersion = 'vs17' }
            '8.5' { $vsVersion = 'vs17' }
            default {
              Write-Error "Unsupported PHP minor: $phpMinor"
              exit 1
            }
          }

          "PHP_WINDOWS_VS_VERSION=$vsVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble PHP runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ( $env:BUILD_DEBUG -eq 'true' ) {
            Set-PSDebug -Trace 1
          }

          $workDir = Join-Path $env:RUNNER_TEMP 'php-build'
          $stagingDir = Join-Path $env:RUNNER_TEMP 'php-artifact'
          $phpArchive = Join-Path $workDir 'php.zip'
          $phpReleaseUrl = "https://windows.php.net/downloads/releases/php-$env:PHP_VERSION-nts-Win32-$env:PHP_WINDOWS_VS_VERSION-x64.zip"
          $phpArchiveUrl = "https://windows.php.net/downloads/releases/archives/php-$env:PHP_VERSION-nts-Win32-$env:PHP_WINDOWS_VS_VERSION-x64.zip"
          $xdebugUrl = "https://xdebug.org/files/php_xdebug-$env:XDEBUG_VERSION-$env:PHP_MINOR-nts-$env:PHP_WINDOWS_VS_VERSION-x86_64.dll"

          Remove-Item -Recurse -Force @($workDir, $stagingDir) -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $workDir, $stagingDir | Out-Null

          try {
            Invoke-WebRequest -Uri $phpReleaseUrl -OutFile $phpArchive -ErrorAction Stop
          } catch {
            Invoke-WebRequest -Uri $phpArchiveUrl -OutFile $phpArchive -ErrorAction Stop
          }
          Expand-Archive -Path $phpArchive -DestinationPath $stagingDir

          $xdebugPath = Join-Path $stagingDir 'ext\php_xdebug.dll'
          Invoke-WebRequest -Uri $xdebugUrl -OutFile $xdebugPath

          $runtimeJson = @{
            phpVersion = $env:PHP_VERSION
            phpMinor = $env:PHP_MINOR
            threadSafety = 'nts'
            platform = $env:PHP_CLI_ARTIFACT_PLATFORM
            arch = $env:PHP_CLI_ARTIFACT_ARCH
            binary = 'php.exe'
            extensionDir = 'ext'
            xdebug = 'ext/php_xdebug.dll'
          } | ConvertTo-Json -Depth 4
          Set-Content -Path (Join-Path $stagingDir 'runtime.json') -Value $runtimeJson

          $env:PATH = "$stagingDir;$env:PATH"

          & (Join-Path $stagingDir 'php.exe') -n `
            -d "extension_dir=$(Join-Path $stagingDir 'ext')" `
            -d "zend_extension=$xdebugPath" `
            -d "xdebug.mode=debug" `
            --ri xdebug
          if ( $LASTEXITCODE -ne 0 ) {
            exit $LASTEXITCODE
          }

          & (Join-Path $stagingDir 'php.exe') -n `
            -d "extension_dir=$(Join-Path $stagingDir 'ext')" `
            -d "extension=curl" `
            -d "extension=gd" `
            -d "extension=mbstring" `
            -d "extension=pdo" `
            -d "extension=pdo_sqlite" `
            -d "extension=sqlite3" `
            -r "echo PHP_VERSION, PHP_EOL;"
          if ( $LASTEXITCODE -ne 0 ) {
            exit $LASTEXITCODE
          }

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'out/php-binaries'
          $stagingDir = Join-Path $env:RUNNER_TEMP 'php-artifact'
          $artifact = "php-$env:PHP_VERSION-cli-$env:PHP_CLI_ARTIFACT_PLATFORM-$env:PHP_CLI_ARTIFACT_ARCH.$env:PHP_CLI_ARCHIVE_EXTENSION"
          $archive = Join-Path $outDir $artifact

          New-Item -ItemType Directory -Force $outDir | Out-Null
          Compress-Archive -Force -Path (Join-Path $stagingDir '*') -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline "$archive.sha256"

      - name: Upload PHP CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ env.PHP_VERSION }}-cli-${{ matrix.target }}
          path: out/php-binaries/*
