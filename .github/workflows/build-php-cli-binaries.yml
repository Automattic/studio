name: Build PHP CLI Binaries
run-name: Build PHP ${{ inputs.php_version }} with Xdebug ${{ inputs.xdebug_version }}

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP patch version to build
        required: true
        default: 8.4.20
      xdebug_version:
        description: Xdebug version to package
        required: true
        default: 3.5.1
      spc_ref:
        description: static-php-cli ref to use for macOS dependency builds
        required: true
        default: 2.8.5
      debug:
        description: Enable verbose build logs
        required: true
        type: boolean
        default: false
      upload_to_apps_cdn:
        description: Upload to Apps CDN
        required: true
        type: boolean
        default: false
      apps_cdn_visibility:
        description: Apps CDN visibility
        required: true
        type: choice
        options:
          - internal
          - external
        default: internal

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
            artifact_platform: macos
            artifact_arch: aarch64
            extensions: &macos_extensions apcu,bcmath,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,ftp,gd,gettext,iconv,igbinary,imagick,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_sqlite,phar,posix,readline,redis,session,shmop,simplexml,sockets,sodium,sqlite3,ssh2,tokenizer,xml,xmlreader,xmlwriter,xsl,yaml,zip,zlib
          - target: macos-x86_64
            runner: macos-15-intel
            artifact_platform: macos
            artifact_arch: x86_64
            extensions: *macos_extensions
          - target: windows-x86_64
            runner: windows-latest
            artifact_platform: windows
            artifact_arch: x86_64
            extensions: apcu,bcmath,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,ftp,gd,iconv,igbinary,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pdo,pdo_mysql,pdo_sqlite,phar,redis,session,shmop,simplexml,sockets,sodium,sqlite3,ssh2,tokenizer,xml,xmlreader,xmlwriter,yaml,zip,zlib
    env:
      PHP_VERSION: ${{ inputs.php_version }}
      XDEBUG_VERSION: ${{ inputs.xdebug_version }}
      SPC_REF: ${{ inputs.spc_ref }}
      PHP_CLI_EXTENSIONS: ${{ matrix.extensions }}
      PHP_CLI_ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
      PHP_CLI_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      BUILD_DEBUG: ${{ inputs.debug }}

    steps:
      - name: Checkout Studio
        uses: actions/checkout@v6

      - name: Checkout static-php-cli
        if: runner.os == 'macOS'
        uses: actions/checkout@v6
        with:
          repository: crazywhalecc/static-php-cli
          ref: ${{ env.SPC_REF }}
          path: .cache/static-php-cli

      - name: Validate PHP version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PHP_VERSION" =~ ^8\.(2|3|4|5)\.[0-9]+$ ]]; then
            echo "Unsupported PHP version: $PHP_VERSION" >&2
            echo "Supported PHP minors: 8.2, 8.3, 8.4, 8.5" >&2
            exit 1
          fi

          php_minor="${PHP_VERSION%.*}"
          echo "PHP_MINOR=$php_minor" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install \
            autoconf \
            automake \
            bison \
            cmake \
            libtool \
            ninja \
            pkg-config \
            re2c

      - name: Setup PHP for static-php-cli
        if: runner.os == 'macOS'
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          tools: composer:v2
          php-version: 8.4
          ini-values: memory_limit=-1
          extensions: curl, openssl, mbstring
        env:
          phpts: nts

      - name: Install static-php-cli dependencies
        if: runner.os == 'macOS'
        working-directory: .cache/static-php-cli
        run: composer install --no-dev --no-interaction --prefer-dist --classmap-authoritative

      - name: Build macOS PHP dependencies with static-php-cli
        if: runner.os == 'macOS'
        working-directory: .cache/static-php-cli
        shell: bash
        run: |
          set -euo pipefail

          if [ "$BUILD_DEBUG" = "true" ]; then
            set -x
          fi

          php_extensions="bz2,curl,dom,gd,gettext,iconv,intl,mbstring,mysqli,openssl,pdo_mysql,pdo_sqlite,readline,simplexml,sodium,sqlite3,xml,xmlreader,xmlwriter,xsl,zip,zlib"
          libraries="bzip2,curl,freetype,gettext,icu,imagemagick,libiconv,libjpeg,libpng,libsodium,libssh2,libxml2,libxslt,libyaml,libzip,onig,openssl,readline,sqlite,zlib"

          php bin/spc doctor --auto-fix
          php bin/spc download \
            --with-php="$PHP_VERSION" \
            --for-extensions="$php_extensions" \
            --for-libs="$libraries" \
            --ignore-cache-sources=php-src \
            --prefer-pre-built
          php bin/spc build:libs "$libraries"

      - name: Build PHP runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$BUILD_DEBUG" = "true" ]; then
            set -x
          fi

          source_url="https://www.php.net/distributions/php-${PHP_VERSION}.tar.gz"
          xdebug_url="https://xdebug.org/files/xdebug-${XDEBUG_VERSION}.tgz"
          work_dir="$RUNNER_TEMP/php-build"
          install_dir="$RUNNER_TEMP/php-install"
          staging_dir="$RUNNER_TEMP/php-artifact"
          spc_root="$GITHUB_WORKSPACE/.cache/static-php-cli/buildroot"

          rm -rf "$work_dir" "$install_dir" "$staging_dir"
          mkdir -p "$work_dir" "$install_dir" "$staging_dir/ext"

          curl --fail --location --retry 3 "$source_url" --output "$work_dir/php.tar.gz"
          tar -xzf "$work_dir/php.tar.gz" -C "$work_dir"

          spc_pkg_config="$(find "$GITHUB_WORKSPACE/.cache/static-php-cli/pkgroot" -path '*/bin/pkg-config' -type f -perm -111 | head -n 1)"
          if [ -z "$spc_pkg_config" ]; then
            echo "static-php-cli pkg-config was not found in pkgroot" >&2
            exit 1
          fi

          pkg_config_static="$work_dir/pkg-config-static"
          cat > "$pkg_config_static" <<SH
          #!/bin/sh
          exec "$spc_pkg_config" --static "\$@"
          SH
          chmod +x "$pkg_config_static"

          export PATH="$(brew --prefix bison)/bin:$spc_root/bin:$PATH"
          export PKG_CONFIG="$pkg_config_static"
          export PKG_CONFIG_LIBDIR="$spc_root/lib/pkgconfig"
          export PKG_CONFIG_PATH="$spc_root/lib/pkgconfig"
          export CPPFLAGS="-I$spc_root/include ${CPPFLAGS:-}"
          export LDFLAGS="-L$spc_root/lib ${LDFLAGS:-}"
          export LIBRARY_PATH="$spc_root/lib:${LIBRARY_PATH:-}"

          "$PKG_CONFIG" --version
          "$PKG_CONFIG" --modversion libxml-2.0

          # Ask static-php-cli for curl's full static link line: libcurl.a + transitive
          # static deps + the macOS frameworks declared in its lib.json. Keeps framework
          # knowledge (CoreFoundation/CoreServices/SystemConfiguration today, plus whatever
          # SPC adds for krb5/idn2/etc. later) out of this workflow.
          curl_static_link="$(cd "$GITHUB_WORKSPACE/.cache/static-php-cli" && php bin/spc spc-config curl --libs --absolute-libs --no-php)"
          curl_frameworks="$(printf '%s' "$curl_static_link" | grep -oE '\-framework [A-Za-z]+' | tr '\n' ' ')"
          export CURL_LIBS="$curl_static_link"
          export LIBS="$curl_frameworks ${LIBS:-}"

          cd "$work_dir/php-${PHP_VERSION}"
          curl_config="$PWD/ext/curl/config.m4"
          perl -0pi -e 's/(PHP_CHECK_LIBRARY\(\[curl\],\s*\[curl_easy_perform\],)/save_LIBS="\$LIBS"\n  LIBS="\$LIBS \$CURL_LIBS"\n\1/s' "$curl_config"
          perl -0pi -e 's/(PHP_CHECK_LIBRARY\(\[curl\],\s*\[curl_easy_perform\],.*?\)\n)/\1  LIBS="\$save_LIBS"\n/s' "$curl_config"
          grep -q 'LIBS="$LIBS $CURL_LIBS"' "$curl_config"
          grep -q 'LIBS="$save_LIBS"' "$curl_config"

          ./buildconf --force
          CURL_STATIC_LINK="$curl_static_link" perl -0pi -e 's/-lcurl/$ENV{CURL_STATIC_LINK}/g' configure
          grep -Fq "$spc_root/lib/libcurl.a" configure

          ./configure \
            --prefix="$install_dir" \
            --with-config-file-path="$install_dir/etc" \
            --with-config-file-scan-dir="$install_dir/etc/conf.d" \
            --disable-cgi \
            --disable-debug \
            --disable-phpdbg \
            --enable-bcmath=shared \
            --enable-calendar=shared \
            --enable-cli \
            --enable-ctype=shared \
            --enable-dba=shared \
            --enable-dom=shared \
            --enable-exif=shared \
            --enable-fileinfo=shared \
            --enable-filter=shared \
            --enable-ftp=shared \
            --enable-gd=shared \
            --enable-intl=shared \
            --enable-mbstring=shared \
            --enable-opcache=shared \
            --enable-pcntl=shared \
            --enable-pdo=shared \
            --enable-phar=shared \
            --enable-posix=shared \
            --enable-session=shared \
            --enable-shmop=shared \
            --enable-simplexml=shared \
            --enable-sockets=shared \
            --enable-tokenizer=shared \
            --enable-xml=shared \
            --enable-xmlreader=shared \
            --enable-xmlwriter=shared \
            --with-bz2=shared,$spc_root \
            --with-curl \
            --with-freetype \
            --with-gettext=shared,$spc_root \
            --with-iconv=shared,$spc_root \
            --with-jpeg \
            --with-mysqli=shared,mysqlnd \
            --with-openssl=shared \
            --with-pdo-mysql=shared,mysqlnd \
            --with-pdo-sqlite=shared \
            --with-readline=shared,$spc_root \
            --with-sodium=shared,$spc_root \
            --with-sqlite3=shared \
            --with-xsl=shared \
            --with-zip=shared \
            --with-zlib=shared,$spc_root

          grep -E 'CoreFoundation|SystemConfiguration|CoreServices' Makefile

          make -j"$(sysctl -n hw.ncpu)"
          make install
          mkdir -p "$install_dir/etc/conf.d"

          ext_work_dir="$work_dir/ext-src"
          mkdir -p "$ext_work_dir"

          build_external_extension() {
            local name="$1"
            local version="$2"
            local url="$3"
            shift 3
            local configure_args=("$@")

            echo "::group::Build $name $version"
            local tarball="$ext_work_dir/${name}-${version}.tgz"
            curl --fail --location --retry 3 "$url" --output "$tarball"
            tar -xzf "$tarball" -C "$ext_work_dir"

            pushd "$ext_work_dir/${name}-${version}" >/dev/null
            "$install_dir/bin/phpize"
            ./configure --with-php-config="$install_dir/bin/php-config" "${configure_args[@]}"
            make -j"$(sysctl -n hw.ncpu)"
            make install
            popd >/dev/null
            echo "::endgroup::"
          }

          build_external_extension xdebug "$XDEBUG_VERSION" "$xdebug_url"
          build_external_extension APCu 5.1.24 https://pecl.php.net/get/APCu-5.1.24.tgz --enable-apcu
          build_external_extension igbinary 3.2.16 https://pecl.php.net/get/igbinary-3.2.16.tgz
          build_external_extension ssh2 1.4.1 https://pecl.php.net/get/ssh2-1.4.1.tgz "--with-ssh2=$spc_root"
          build_external_extension yaml 2.2.4 https://pecl.php.net/get/yaml-2.2.4.tgz "--with-yaml=$spc_root"
          build_external_extension imagick 3.7.0 https://pecl.php.net/get/imagick-3.7.0.tgz "--with-imagick=$spc_root"
          build_external_extension redis 6.0.2 https://pecl.php.net/get/redis-6.0.2.tgz --enable-redis --enable-redis-igbinary

          install_extension_dir="$("$install_dir/bin/php-config" --extension-dir)"
          cp "$install_dir/bin/php" "$staging_dir/php"
          chmod +x "$staging_dir/php"
          cp "$install_extension_dir"/*.so "$staging_dir/ext/"

          extension_dir="$staging_dir/ext"
          relative_extension_dir="ext"

          find_macho_files() {
            find "$staging_dir" -type f \( -name '*.dylib' -o -name '*.so' -o -perm -111 \) -print | while read -r candidate; do
              if file "$candidate" | grep -q 'Mach-O'; then
                printf '%s\n' "$candidate"
              fi
            done
          }

          find_macho_files | while read -r file; do
            if otool -L "$file" | grep -E '/opt/homebrew/|/usr/local/'; then
              echo "Found non-portable Homebrew dependency in $file" >&2
              exit 1
            fi
            if otool -L "$file" | grep -F "$spc_root"; then
              echo "Found non-portable static-php-cli dependency in $file" >&2
              exit 1
            fi
          done

          xattr -cr "$staging_dir"
          find_macho_files | while read -r file; do
            codesign --force --sign - "$file"
            codesign --verify --strict "$file"
          done

          cat > "$staging_dir/runtime.json" <<JSON
          {
            "phpVersion": "$PHP_VERSION",
            "phpMinor": "$PHP_MINOR",
            "threadSafety": "nts",
            "platform": "$PHP_CLI_ARTIFACT_PLATFORM",
            "arch": "$PHP_CLI_ARTIFACT_ARCH",
            "binary": "php",
            "extensionDir": "$relative_extension_dir",
            "xdebug": "$relative_extension_dir/xdebug.so"
          }
          JSON

          "$staging_dir/php" -n \
            -d "extension_dir=$extension_dir" \
            -d "zend_extension=$extension_dir/xdebug.so" \
            -d "xdebug.mode=debug" \
            --ri xdebug

          echo "Smoke testing built-in extension: curl"
          "$staging_dir/php" -n \
            -r 'if ( ! extension_loaded( "curl" ) ) { fwrite( STDERR, "curl is not loaded\n" ); exit( 1 ); } echo PHP_VERSION, PHP_EOL;'

          smoke_extensions=(apcu gd gettext igbinary imagick mbstring pdo pdo_sqlite redis sodium sqlite3 ssh2 xsl yaml)
          for extension in "${smoke_extensions[@]}"; do
            echo "Smoke testing extension: $extension"
            otool -L "$extension_dir/$extension.so"
            "$staging_dir/php" -n \
              -d "extension_dir=$extension_dir" \
              -d "extension=$extension" \
              -r 'echo PHP_VERSION, PHP_EOL;'
          done

          smoke_extension_args=()
          loaded_count=0
          for extension in "${smoke_extensions[@]}"; do
            smoke_extension_args+=(-d "extension=$extension")
            loaded_count=$((loaded_count + 1))
            echo "Smoke testing extension set: ${smoke_extensions[*]:0:loaded_count}"
            "$staging_dir/php" -n \
              -d "extension_dir=$extension_dir" \
              "${smoke_extension_args[@]}" \
              -r 'echo PHP_VERSION, PHP_EOL;'
          done

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          out_dir="$GITHUB_WORKSPACE/out/php-binaries"
          staging_dir="$RUNNER_TEMP/php-artifact"
          artifact="php-${PHP_VERSION}-cli-${PHP_CLI_ARTIFACT_PLATFORM}-${PHP_CLI_ARTIFACT_ARCH}.zip"

          mkdir -p "$out_dir"
          ( cd "$staging_dir" && zip -qr "$out_dir/$artifact" . )
          shasum -a 256 "$out_dir/$artifact" | awk '{print $1}' > "$out_dir/$artifact.sha256"

      - name: Resolve Windows runtime metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $phpMinor = $env:PHP_MINOR
          switch ( $phpMinor ) {
            '8.2' { $vsVersion = 'vs16' }
            '8.3' { $vsVersion = 'vs16' }
            '8.4' { $vsVersion = 'vs17' }
            '8.5' { $vsVersion = 'vs17' }
            default {
              Write-Error "Unsupported PHP minor: $phpMinor"
              exit 1
            }
          }

          "PHP_WINDOWS_VS_VERSION=$vsVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble PHP runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ( $env:BUILD_DEBUG -eq 'true' ) {
            Set-PSDebug -Trace 1
          }

          $workDir = Join-Path $env:RUNNER_TEMP 'php-build'
          $stagingDir = Join-Path $env:RUNNER_TEMP 'php-artifact'
          $phpArchive = Join-Path $workDir 'php.zip'
          $phpReleaseUrl = "https://windows.php.net/downloads/releases/php-$env:PHP_VERSION-nts-Win32-$env:PHP_WINDOWS_VS_VERSION-x64.zip"
          $phpArchiveUrl = "https://windows.php.net/downloads/releases/archives/php-$env:PHP_VERSION-nts-Win32-$env:PHP_WINDOWS_VS_VERSION-x64.zip"
          $xdebugUrl = "https://xdebug.org/files/php_xdebug-$env:XDEBUG_VERSION-$env:PHP_MINOR-nts-$env:PHP_WINDOWS_VS_VERSION-x86_64.dll"

          Remove-Item -Recurse -Force @($workDir, $stagingDir) -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $workDir, $stagingDir | Out-Null

          try {
            Invoke-WebRequest -Uri $phpReleaseUrl -OutFile $phpArchive -ErrorAction Stop
          } catch {
            Invoke-WebRequest -Uri $phpArchiveUrl -OutFile $phpArchive -ErrorAction Stop
          }
          Expand-Archive -Path $phpArchive -DestinationPath $stagingDir

          $xdebugPath = Join-Path $stagingDir 'ext\php_xdebug.dll'
          Invoke-WebRequest -Uri $xdebugUrl -OutFile $xdebugPath

          function Add-PECLExtension {
            param(
              [Parameter(Mandatory)][string]$Name,
              [Parameter(Mandatory)][string]$Version
            )

            Write-Host "::group::Fetch PECL $Name $Version"
            $url = "https://windows.php.net/downloads/pecl/releases/$Name/$Version/php_$Name-$Version-$env:PHP_MINOR-nts-$env:PHP_WINDOWS_VS_VERSION-x64.zip"
            $zipPath = Join-Path $workDir "pecl-$Name.zip"
            $extractDir = Join-Path $workDir "pecl-$Name"

            if ( Test-Path $extractDir ) { Remove-Item -Recurse -Force $extractDir }
            Invoke-WebRequest -Uri $url -OutFile $zipPath -ErrorAction Stop
            Expand-Archive -Path $zipPath -DestinationPath $extractDir

            $extDll = Get-ChildItem -Path $extractDir -Filter "php_$Name.dll" -Recurse | Select-Object -First 1
            if ( $null -eq $extDll ) {
              throw "Expected php_$Name.dll in PECL package for $Name $Version"
            }
            Copy-Item -Path $extDll.FullName -Destination (Join-Path $stagingDir "ext\php_$Name.dll") -Force

            Get-ChildItem -Path $extractDir -Filter '*.dll' -Recurse |
              Where-Object { $_.Name -ne "php_$Name.dll" } |
              ForEach-Object { Copy-Item -Path $_.FullName -Destination (Join-Path $stagingDir $_.Name) -Force }
            Write-Host "::endgroup::"
          }

          Add-PECLExtension -Name apcu -Version 5.1.24
          Add-PECLExtension -Name igbinary -Version 3.2.16
          Add-PECLExtension -Name redis -Version 6.0.2
          Add-PECLExtension -Name ssh2 -Version 1.4.1
          Add-PECLExtension -Name yaml -Version 2.2.4

          $runtimeJson = @{
            phpVersion = $env:PHP_VERSION
            phpMinor = $env:PHP_MINOR
            threadSafety = 'nts'
            platform = $env:PHP_CLI_ARTIFACT_PLATFORM
            arch = $env:PHP_CLI_ARTIFACT_ARCH
            binary = 'php.exe'
            extensionDir = 'ext'
            xdebug = 'ext/php_xdebug.dll'
          } | ConvertTo-Json -Depth 4
          Set-Content -Path (Join-Path $stagingDir 'runtime.json') -Value $runtimeJson

          $env:PATH = "$stagingDir;$env:PATH"

          & (Join-Path $stagingDir 'php.exe') -n `
            -d "extension_dir=$(Join-Path $stagingDir 'ext')" `
            -d "zend_extension=$xdebugPath" `
            -d "xdebug.mode=debug" `
            --ri xdebug
          if ( $LASTEXITCODE -ne 0 ) {
            exit $LASTEXITCODE
          }

          & (Join-Path $stagingDir 'php.exe') -n `
            -d "extension_dir=$(Join-Path $stagingDir 'ext')" `
            -d "extension=apcu" `
            -d "extension=curl" `
            -d "extension=gd" `
            -d "extension=igbinary" `
            -d "extension=mbstring" `
            -d "extension=pdo" `
            -d "extension=pdo_sqlite" `
            -d "extension=redis" `
            -d "extension=sodium" `
            -d "extension=sqlite3" `
            -d "extension=ssh2" `
            -d "extension=yaml" `
            -r "echo PHP_VERSION, PHP_EOL;"
          if ( $LASTEXITCODE -ne 0 ) {
            exit $LASTEXITCODE
          }

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'out/php-binaries'
          $stagingDir = Join-Path $env:RUNNER_TEMP 'php-artifact'
          $artifact = "php-$env:PHP_VERSION-cli-$env:PHP_CLI_ARTIFACT_PLATFORM-$env:PHP_CLI_ARTIFACT_ARCH.zip"
          $archive = Join-Path $outDir $artifact

          New-Item -ItemType Directory -Force $outDir | Out-Null
          Compress-Archive -Force -Path (Join-Path $stagingDir '*') -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline "$archive.sha256"

      - name: Upload PHP CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ env.PHP_VERSION }}-cli-${{ matrix.target }}
          path: out/php-binaries/*

  publish-apps-cdn:
    name: Publish Apps CDN artifacts
    needs: build
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: ${{ inputs.php_version }}
      PHP_CLI_VISIBILITY: ${{ inputs.apps_cdn_visibility }}
      DRY_RUN: ${{ inputs.upload_to_apps_cdn && 'false' || 'true' }}
      WPCOM_API_TOKEN: ${{ secrets.WPCOM_API_TOKEN }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download PHP CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php-${{ env.PHP_VERSION }}-cli-*
          path: out/php-binaries
          merge-multiple: true

      - name: Publish PHP CLI artifacts to Apps CDN
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" != "true" ] && [ -z "${WPCOM_API_TOKEN:-}" ]; then
            echo "WPCOM_API_TOKEN secret is required to upload PHP CLI artifacts to Apps CDN."
            exit 1
          fi

          upload_results_file="${PWD}/out/php-binaries/apps-cdn-upload-results.json"

          bundle exec fastlane publish_php_cli_binaries \
            version:"${PHP_VERSION}" \
            artifacts_dir:"${PWD}/out/php-binaries" \
            visibility:"${PHP_CLI_VISIBILITY}" \
            output_file:"${upload_results_file}"

          echo "### Apps CDN PHP CLI upload" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run completed for PHP ${PHP_VERSION} CLI artifacts with ${PHP_CLI_VISIBILITY} visibility." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded PHP ${PHP_VERSION} CLI artifacts with ${PHP_CLI_VISIBILITY} visibility." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          PHP_CLI_UPLOAD_RESULTS_FILE="$upload_results_file" ruby -rjson -e '
            results = JSON.parse(File.read(ENV.fetch("PHP_CLI_UPLOAD_RESULTS_FILE")))

            File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |summary|
              summary.puts "| File | Apps CDN URL |"
              summary.puts "| --- | --- |"

              results.each do |file_name, result|
                url = result["cdn_url"].to_s
                url_output = url.empty? ? "Dry run (not uploaded)" : "<#{url}>"
                summary.puts "| `#{file_name}` | #{url_output} |"
              end
            end
          '
