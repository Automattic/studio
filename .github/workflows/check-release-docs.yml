name: Check release documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Stable release tag, for example v2.2.0'
        type: string
        required: true
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'release' || ! github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: trunk
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Verify the live docs and changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: node scripts/check-release-docs.mjs "$RELEASE_TAG" HEAD 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
