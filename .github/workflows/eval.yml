name: Agent Evaluation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Slack channel ID to post results (leave empty to skip notification)'
        required: false
        type: string
      test_filter:
        description: 'Run only first N tests (must be a number)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  eval:
    name: Run agent evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run cli:build

      - name: Run evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          ARGS="--no-cache --output /tmp/eval-results.json"
          if [ -n "$TEST_FILTER" ]; then
            if ! [[ "$TEST_FILTER" =~ ^[0-9]+$ ]]; then
              echo "Error: test_filter must be a number"
              exit 1
            fi
            ARGS="$ARGS -n $TEST_FILTER"
          fi
          npx promptfoo eval -c eval/promptfoo.config.yaml $ARGS

      - name: Parse results
        id: results
        if: always()
        run: |
          if [ ! -f /tmp/eval-results.json ]; then
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          jq -r '
            "passed=" + ([.results.results[] | select(.success == true)] | length | tostring),
            "failed=" + ([.results.results[] | select(.success == false)] | length | tostring),
            "total=" + (.results.results | length | tostring)
          ' /tmp/eval-results.json >> $GITHUB_OUTPUT

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          jq -r '.results.results[] |
            "• " + (.description // .vars.caseId // "unknown") + ": " +
            (if .success then "✅" elif .error then "❌ error" else "❌ fail" end)
          ' /tmp/eval-results.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: (inputs.channel_id || github.event_name == 'schedule') && steps.results.outputs.total != '0'
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.channel_id || 'C08LZ79MKG9' }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          TOTAL: ${{ steps.results.outputs.total }}
          SUMMARY: ${{ steps.results.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$FAILED" = "0" ]; then
            EMOJI=":white_check_mark:"
            COLOR="#36a64f"
            HEADER="Agent eval: $PASSED/$TOTAL passed"
          else
            EMOJI=":x:"
            COLOR="#e01e5a"
            HEADER="Agent eval: $FAILED/$TOTAL failed"
          fi

          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg header "$EMOJI $HEADER" \
            --arg summary "$SUMMARY" \
            --arg url "$RUN_URL" \
            --arg color "$COLOR" \
            '{
              channel: $channel,
              username: "Studio Eval",
              icon_emoji: ":test_tube:",
              attachments: [{
                color: $color,
                blocks: [
                  { type: "section", text: { type: "mrkdwn", text: $header } },
                  { type: "section", text: { type: "mrkdwn", text: $summary } },
                  { type: "context", elements: [{ type: "mrkdwn", text: ("<" + $url + "|View run>") }] }
                ]
              }]
            }' | \
          curl -sf -o /dev/null -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @- || echo "Warning: Slack notification failed"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/eval-results.json
          retention-days: 7
