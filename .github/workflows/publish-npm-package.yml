name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: 'npm dist-tag (e.g., "next" for prereleases). Leave empty to publish as "latest".'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Download language packs
        run: npm run download-language-packs

      - name: Publish to npm
        run: |
          PUBLISH_ARGS=(-w wp-studio --provenance --access public)
          if [ -n "${{ inputs.npm-tag }}" ]; then
            PUBLISH_ARGS+=(--tag "${{ inputs.npm-tag }}")
            echo "Publishing with dist-tag: ${{ inputs.npm-tag }}"
          else
            echo "Publishing as latest"
          fi
          npm publish "${PUBLISH_ARGS[@]}"

  publish-mcp-registry:
    needs: publish
    if: inputs.npm-tag == ''
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install mcp-publisher
        run: |
          ARCHIVE=mcp-publisher_linux_amd64.tar.gz
          RELEASE_URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "${RELEASE_URL}/${ARCHIVE}"
          curl -fsSLO "${RELEASE_URL}/${ARCHIVE}.sigstore.json"
          cosign verify-blob "$ARCHIVE" \
            --bundle "${ARCHIVE}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "$ARCHIVE" mcp-publisher

      - name: Match server.json to the published version
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg version "$VERSION" '.version = $version | .packages[0].version = $version' server.json > server.tmp
          mv server.tmp server.json

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
