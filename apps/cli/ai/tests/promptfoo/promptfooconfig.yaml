description: >-
  Regression tests for the WordPress Studio AI agent prompt. Each case pits a
  single user question against the live system prompt (built from
  apps/cli/ai/system-prompt.ts) plus the currently-installed skills, and grades
  the first response against a specific rule. Failures mean a recently-landed
  rule has silently regressed.

providers:
  - id: anthropic:messages:claude-sonnet-4-5-20250929
    config:
      temperature: 0
      max_tokens: 3000

prompts:
  - file://prompt.mjs

defaultTest:
  options:
    cache: true

tests:
  # --------------------------------------------------------------------------
  # 1. wp_cli takes literal arguments — no shell substitution, pipes, or
  #    command chaining. These silently fail inside the WASM wrapper.
  # --------------------------------------------------------------------------
  - description: "wp_cli: no shell syntax, filter via eval"
    vars:
      userPrompt: >-
        You're working on a local Studio site. How would you filter post 5's
        content to find references to the class name `about-img`? Show the
        concrete command you would run.
    assert:
      - type: contains
        value: "wp_cli eval"
      - type: not-contains
        value: "| grep"
      - type: not-contains
        value: "$("
      # `&&` used as a bash command separator on the same line as a wp_cli
      # call is the antipattern. `&&` inside a single/double-quoted string
      # passed to `wp_cli eval` is PHP logical-AND, which is fine — strip
      # quoted strings before checking.
      - type: javascript
        value: |
          const stripped = output.split('\n').map(l => l.replace(/'[^']*'/g, "''").replace(/"[^"]*"/g, '""'));
          const offending = stripped.filter(l => /\bwp_cli\b/.test(l) && /&&/.test(l));
          const pass = offending.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no shell `&&` on wp_cli lines' : `found shell && on wp_cli line: ${offending[0]}` };

  # --------------------------------------------------------------------------
  # 2. PHASE 2: theme stylesheet is copied from the prototype via `cp`, not
  #    regenerated in a Write. Regenerating drifts from the phase-1-approved
  #    screenshot and burns 60–90s of silent generation.
  # --------------------------------------------------------------------------
  - description: "PHASE 2: theme stylesheet copied with cp, not regenerated"
    vars:
      userPrompt: >-
        You're starting PHASE 2 of a block theme build. The PHASE 1 prototype
        has been screenshot-approved and its stylesheet is at
        `/Users/alice/Studio/my-site/tmp/prototype/style.css`. What is the
        VERY FIRST action you take to produce the theme's main stylesheet
        at `wp-content/themes/<slug>/assets/css/main.css`? Show the exact
        tool call.
    assert:
      - type: regex
        value: "cp\\s+[^\\n]*prototype/style\\.css[^\\n]*main\\.css"
      - type: javascript
        value: "!/\\bWrite\\b[\\s\\S]{0,120}main\\.css/.test(output)"

  # --------------------------------------------------------------------------
  # 3. Button CSS migration: all paint goes on the inner link, not the outer
  #    wrapper. The wrapper carries layout only.
  # --------------------------------------------------------------------------
  - description: "Button paint on .wp-block-button__link, not the wrapper"
    vars:
      userPrompt: >-
        You are porting prototype CSS to a block theme. Migrate this prototype
        rule so it renders identically on a `core/button` block that carries
        `className: "btn-primary"`:

        ```
        .btn-primary {
          background: gold;
          padding: 1rem 2rem;
          border: 2px solid gold;
          color: black;
        }
        ```

        Output the migrated CSS and a one-sentence explanation of why the
        selector changes.
    assert:
      - type: contains
        value: ".wp-block-button.btn-primary .wp-block-button__link"
      - type: javascript
        value: |
          // The outer wrapper selector `.wp-block-button.btn-primary { ... }`
          // must NOT carry any paint properties in a rule of its own.
          const ruleRe = /\.wp-block-button\.btn-primary\s*\{([^}]*)\}/g;
          let m;
          let bad = null;
          while ((m = ruleRe.exec(output)) !== null) {
            if (/(background|padding|border|color)\s*:/.test(m[1])) {
              bad = m[0];
              break;
            }
          }
          if (bad) {
            return { pass: false, score: 0, reason: `paint property found on the .wp-block-button.btn-primary wrapper: ${bad.slice(0, 120)}` };
          }
          return { pass: true, score: 1, reason: 'wrapper carries no paint' };
      - type: llm-rubric
        value: >-
          The response explains that the `.wp-block-button` wrapper gets zero
          paint (or equivalent: "the wrapper carries layout only",
          "all paint on the inner link", "defaults to prevent doubled
          border/padding", etc.). A bare assertion like "we need to change the
          selector" without naming the reason does NOT satisfy this rubric.

  # --------------------------------------------------------------------------
  # 4. theme.json neutralizes wp-element-button defaults so className rules
  #    are the only source of button paint.
  # --------------------------------------------------------------------------
  - description: "theme.json: styles.elements.button is neutralized"
    vars:
      userPrompt: >-
        Generate a complete `theme.json` for a block theme whose button paint
        is supplied entirely via `className` selectors on
        `.wp-block-button.<name> .wp-block-button__link`. The theme does NOT
        define any button styling in theme.json itself. Output the JSON in a
        single ```json``` code block — no prose outside the block.
    assert:
      - type: javascript
        value: |
          const m = output.match(/```(?:json)?\s*([\s\S]*?)```/);
          const body = m ? m[1] : output;
          let j;
          try { j = JSON.parse(body); } catch (e) {
            return { pass: false, score: 0, reason: `output did not contain a parseable JSON block: ${e.message}` };
          }
          const btn = j?.styles?.elements?.button;
          if (!btn) {
            return { pass: false, score: 0, reason: 'styles.elements.button missing' };
          }
          const checks = {
            'color.background=transparent': btn.color?.background === 'transparent',
            'spacing.padding=0': btn.spacing?.padding === '0' || btn.spacing?.padding === 0,
            'border.width=0': btn.border?.width === '0' || btn.border?.width === 0,
            'border.radius=0': btn.border?.radius === '0' || btn.border?.radius === 0,
          };
          const missing = Object.entries(checks).filter(([, ok]) => !ok).map(([k]) => k);
          if (missing.length) {
            return { pass: false, score: 0, reason: `styles.elements.button is not neutralized: ${missing.join(', ')}` };
          }
          return { pass: true, score: 1, reason: 'wp-element-button neutralized' };

  # --------------------------------------------------------------------------
  # 5. theme.json sets contentSize / wideSize to match the prototype so
  #    `.is-layout-constrained > *` stops clamping content to WP's default.
  # --------------------------------------------------------------------------
  - description: "theme.json: contentSize/wideSize match prototype max-widths"
    vars:
      userPrompt: >-
        Generate a complete `theme.json` for a block theme. The prototype uses
        max-width 1200px for main constrained content and 1400px for wide
        blocks. Button paint is supplied via className rules on
        `.wp-block-button__link`, NOT via theme.json. Output the JSON in a
        single ```json``` code block — no prose outside the block.
    assert:
      - type: javascript
        value: |
          const m = output.match(/```(?:json)?\s*([\s\S]*?)```/);
          const body = m ? m[1] : output;
          let j;
          try { j = JSON.parse(body); } catch (e) {
            return { pass: false, score: 0, reason: `output did not contain a parseable JSON block: ${e.message}` };
          }
          const layout = j?.settings?.layout;
          if (layout?.contentSize !== '1200px' || layout?.wideSize !== '1400px') {
            return { pass: false, score: 0, reason: `settings.layout = ${JSON.stringify(layout)}; expected contentSize="1200px" wideSize="1400px"` };
          }
          return { pass: true, score: 1, reason: 'contentSize/wideSize match prototype' };

  # --------------------------------------------------------------------------
  # 6. A section that contains non-convertible children (inline SVG) must be
  #    decomposed — core/html is isolated on the SVG, NOT on the section.
  # --------------------------------------------------------------------------
  - description: "Hero section decomposes; core/html only for the SVG"
    vars:
      userPrompt: >-
        Convert this hero section to valid Gutenberg block markup. Preserve
        every className on the outer wrappers and decompose the section so
        core/html is used ONLY where no native block equivalent exists. Output
        only the block markup.

        ```
        <section class="hero">
          <h1>Welcome</h1>
          <div class="hero-canvas">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>
          </div>
          <p>subtitle</p>
        </section>
        ```
    assert:
      - type: regex
        value: "wp:group[^\\n]*\"tagName\"\\s*:\\s*\"section\""
      - type: contains
        value: "wp:heading"
      - type: contains
        value: "wp:paragraph"
      - type: javascript
        value: |
          // If any core/html block exists, its contents must be only the svg
          // (no section, no h1, no p inside the core/html block).
          const re = /<!-- wp:html -->([\s\S]*?)<!-- \/wp:html -->/g;
          let m;
          let seenHtml = false;
          while ((m = re.exec(output)) !== null) {
            seenHtml = true;
            const inner = m[1];
            if (/<section\b/i.test(inner)) {
              return { pass: false, score: 0, reason: 'core/html wraps a <section> — the section should be core/group instead' };
            }
            if (/<h1\b/i.test(inner)) {
              return { pass: false, score: 0, reason: 'core/html contains <h1> — should be core/heading' };
            }
            if (/<p\b/i.test(inner)) {
              return { pass: false, score: 0, reason: 'core/html contains <p> — should be core/paragraph' };
            }
          }
          if (!seenHtml) {
            return { pass: false, score: 0, reason: 'no core/html block found; the SVG should be wrapped in core/html' };
          }
          return { pass: true, score: 1, reason: 'core/html is isolated on the SVG' };

  # --------------------------------------------------------------------------
  # 7. Generic decompose: a card <div> with heading, paragraph, button
  #    becomes four native blocks. No core/html needed.
  # --------------------------------------------------------------------------
  - description: "Card HTML decomposes into native blocks; no core/html"
    vars:
      userPrompt: >-
        Convert this HTML to valid Gutenberg block markup. Preserve every
        className. Output only the block markup.

        ```
        <div class="card">
          <h3>Fast</h3>
          <p>Instant setup.</p>
          <a class="btn" href="#">Learn</a>
        </div>
        ```
    assert:
      - type: contains
        value: "wp:group"
      - type: contains
        value: "wp:heading"
      - type: contains
        value: "wp:paragraph"
      - type: contains
        value: "wp:buttons"
      # wp:button followed by space or attr block — distinguishes from wp:buttons.
      - type: regex
        value: "wp:button(\\s|\\{)"
      - type: not-contains
        value: "wp:html"

  # --------------------------------------------------------------------------
  # 8. Applying page content: use `wp_cli eval` + ABSPATH, never
  #    `--post_content-file=<host path>` which fails silently in WASM.
  # --------------------------------------------------------------------------
  - description: "Apply content via wp_cli eval + ABSPATH, not --post_content-file"
    vars:
      userPrompt: >-
        You've written block markup to `<site>/tmp/page-home.html`. The
        corresponding page already exists and its post ID is 5. Give the
        single concrete wp_cli tool call you would run to apply the file's
        contents as post 5's `post_content`.
    assert:
      - type: contains
        value: "wp_cli eval"
      - type: contains
        value: "ABSPATH"
      - type: contains
        value: "file_get_contents"
      - type: contains
        value: "wp_update_post"
      - type: not-contains
        value: "--post_content-file"

  # --------------------------------------------------------------------------
  # 9. PHASE 1 prototype stylesheet begins as a <2KB skeleton: anchor
  #    comments only, `tokens` first, no full section rules.
  # --------------------------------------------------------------------------
  - description: "PHASE 1 style.css first Write is a skeleton with tokens anchor"
    vars:
      userPrompt: >-
        You are starting PHASE 1 for a farm landing page site. The site path
        is `<site>` and the prototype stylesheet will live at
        `<site>/tmp/prototype/style.css`. What is the content of your FIRST
        `Write` to that file? Output only the file content in a single
        ```css``` code block — no prose outside the block.
    assert:
      - type: javascript
        value: |
          const m = output.match(/```(?:css)?\s*([\s\S]*?)```/);
          const content = m ? m[1] : output;
          const bytes = Buffer.byteLength(content, 'utf8');
          if (bytes >= 2048) {
            return { pass: false, score: 0, reason: `skeleton is ${bytes} bytes, expected <2048` };
          }
          const anchors = [...content.matchAll(/\/\*\s*===\s*([a-z0-9-]+)\s*===\s*\*\//gi)];
          if (anchors.length < 2) {
            return { pass: false, score: 0, reason: `found ${anchors.length} "/* === name === */" anchors, expected >=2` };
          }
          if (anchors[0][1].toLowerCase() !== 'tokens') {
            return { pass: false, score: 0, reason: `first anchor was '${anchors[0][1]}', expected 'tokens'` };
          }
          return { pass: true, score: 1, reason: `skeleton is ${bytes} bytes with ${anchors.length} anchors, tokens first` };

  # --------------------------------------------------------------------------
  # 10. The first Phase 2 action after a Phase 1 screenshot approval is
  #     invoking the `blockify` skill, before any block markup is written.
  # --------------------------------------------------------------------------
  - description: "First Phase 2 action is invoking the blockify skill"
    vars:
      userPrompt: >-
        You've just approved the PHASE 1 prototype screenshot for a local
        site. Phase 2 is about to begin. What is your VERY FIRST tool call in
        Phase 2, BEFORE any block markup is written or any theme file is
        created? Name the tool and its argument.
    assert:
      - type: regex
        value: "\\b[Bb]lockify\\b"
      - type: llm-rubric
        value: >-
          The response names invoking/loading/running the `blockify` skill as
          the very first Phase 2 action — before any Write of block markup,
          before any theme.json, before any template file, before any cp of
          the stylesheet. Answering with some other first step (e.g. "write
          theme.json", "cp the stylesheet", "create a page") does NOT satisfy
          this rubric.
