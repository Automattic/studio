<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
	<title>Install WordPress Studio</title>
	<desc>Studio's regular dot grid behind a horizontal drag-to-Applications layout.</desc>
	<style>
		:root { color-scheme: light; --background: oklch( from #fff calc( l - 0 * 0.00025 ) calc( 0 * 0.00025 * 1 ) 260 ); --foreground: oklch( calc( 0.275 - 0 * 0.001 ) calc( 0 * 0.00025 * 1 ) 260 ); --muted-foreground: oklch( from oklch( from #fff calc( l - 0 * 0.00025 ) calc( 0 * 0.00025 * 1 ) 260 ) calc( l - 0.45 - 0 * 0.0015 ) calc( 0 * 0.0004 * 1 ) 260 ); --preview-dot: color-mix( in oklab, light-dark( color-mix( in oklab, oklch( calc( 0.275 - 0 * 0.001 ) calc( 0 * 0.00025 * 1 ) 260 ) calc( 1% + calc( 7% + 0 * 0.033333% ) * 3 ), oklch( from #fff calc( l - 0 * 0.00025 ) calc( 0 * 0.00025 * 1 ) 260 ) ), color-mix( in oklab, oklch( calc( 0.275 - 0 * 0.001 ) calc( 0 * 0.00025 * 1 ) 260 ) calc( 1% + calc( 7% + 0 * 0.033333% ) * 2 ), oklch( from #fff calc( l - 0 * 0.00025 ) calc( 0 * 0.00025 * 1 ) 260 ) ) ), oklch( calc( 0.275 - 0 * 0.001 ) calc( 0 * 0.00025 * 1 ) 260 ) 4% ); }
		text { font-family: Inter, sans-serif; }
	</style>
