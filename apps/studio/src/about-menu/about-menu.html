<!doctype html>
<html class="desktop-preferences">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<style type="text/css">
			:root {
				color-scheme: light dark;
				--background: Canvas;
				--foreground: CanvasText;
				--muted-foreground: color-mix( in srgb, CanvasText 60%, Canvas );
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: var( --background );
				color: var( --foreground );
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				font-size: 11px;
				line-height: 16px;
				text-align: center;
				user-select: none;
			}

			.studio-mark {
				display: block;
				margin: 4px auto 10px;
				filter: invert( 1 );
			}

			@media ( prefers-color-scheme: dark ) {
				.studio-mark {
					filter: none;
				}
			}

			p {
				margin: 0;
			}

			.studio-name {
				font-size: 15px;
				font-weight: 600;
				line-height: 20px;
				letter-spacing: -0.3px;
			}

			.version {
				margin-top: 8px;
				line-height: 20px;
				color: var( --muted-foreground );
				font-size: 10px;
				user-select: all;
			}

			a {
				color: inherit;
				text-decoration: none;
				text-underline-offset: 3px;
			}

			a:hover {
				text-decoration: underline;
			}

			a:focus-visible {
				outline: 2px solid var( --foreground );
				outline-offset: 3px;
				border-radius: 2px;
			}

			.links {
				display: flex;
				justify-content: center;
				gap: 10px;
				margin-top: 8px;
				line-height: 20px;
			}

			.separator {
				color: var( --muted-foreground );
			}
		</style>
		<title>About WordPress Studio</title>
	</head>
	<body>
		<div>
			<!-- These strings are placeholders replaced by the strings in open-about-menu.ts.
    Please make sure to update the corresponding strings in the open-about-menu.ts file -->
			<img
				class="studio-mark"
				src="./studio-app-icon.png"
				alt="WordPress Studio App Icon"
				width="56"
				height="56"
			/>
			<p class="studio-name" id="studio-by-wpcom">WordPress Studio</p>
			<p class="version"><span id="version-text">x.y.z (...)</span></p>
			<p class="links">
				<a href="https://github.com/Automattic/studio" target="_blank">GitHub</a>
				<span class="separator">&middot;</span>
				<a id="release-notes" href="https://github.com/Automattic/studio/releases" target="_blank"
					>Release Notes</a
				>
			</p>
		</div>
	</body>
</html>
