<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Studio</title>
		<style>
			/* Boot splash: shown the instant this document parses — before the
			   bundle loads and React mounts — so switching into the new UI never
			   flashes a bare white screen. React replaces #root on first render,
			   which clears this markup. Colors are hardcoded (the design-token
			   stylesheet isn't loaded yet) to match the app surface in both
			   schemes. */
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				background-color: #fdfdfd;
			}
			#studio-boot-splash {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: #fdfdfd;
			}
			#studio-boot-splash svg {
				width: 72px;
				height: 72px;
				color: #3858e9;
				animation: studio-boot-pulse 1.6s ease-in-out infinite;
			}
			@keyframes studio-boot-pulse {
				0%,
				100% {
					opacity: 0.55;
					transform: scale(0.97);
				}
				50% {
					opacity: 1;
					transform: scale(1);
				}
			}
			@media (prefers-color-scheme: dark) {
				body,
				#studio-boot-splash {
					background-color: #1e1e1e;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#studio-boot-splash svg {
					animation: none;
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div id="studio-boot-splash" aria-hidden="true">
				<svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="WordPress Studio">

					/>

			</div>
		</div>

</html>
