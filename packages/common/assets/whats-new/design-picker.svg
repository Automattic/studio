<rect x="0.8" y="0.8" width="174.4" height="86.4" rx="9.2" stroke="url(#design_picker_accent)" stroke-width="1.6"/>
<rect x="12" y="12" width="152" height="30" rx="4" fill="white" fill-opacity="0.1"/>
<rect x="12" y="50" width="70" height="7" rx="3.5" fill="#DBDBDB" fill-opacity="0.85"/>
<rect x="12" y="63" width="110" height="5" rx="2.5" fill="white" fill-opacity="0.22"/>
<rect x="12" y="73" width="88" height="5" rx="2.5" fill="white" fill-opacity="0.22"/>
<circle cx="150" cy="68" r="6" fill="url(#design_picker_accent)"/>
<circle cx="136" cy="68" r="6" fill="white" fill-opacity="0.16"/>

<!-- Top-right. -->
<g opacity="0.5">
<rect x="200" y="0" width="176" height="88" rx="10" fill="#1A1A1A"/>
<rect x="200.5" y="0.5" width="175" height="87" rx="9.5" stroke="white" stroke-opacity="0.4"/>
<rect x="212" y="12" width="70" height="64" rx="4" fill="white" fill-opacity="0.08"/>
<rect x="292" y="12" width="72" height="7" rx="3.5" fill="#DBDBDB" fill-opacity="0.7"/>
<rect x="292" y="26" width="60" height="5" rx="2.5" fill="white" fill-opacity="0.2"/>
<rect x="292" y="36" width="66" height="5" rx="2.5" fill="white" fill-opacity="0.2"/>
<circle cx="298" cy="62" r="6" fill="white" fill-opacity="0.16"/>
<circle cx="312" cy="62" r="6" fill="white" fill-opacity="0.16"/>
</g>

<!-- Bottom-left. -->
<g opacity="0.5">
<rect x="0" y="104" width="176" height="88" rx="10" fill="#1A1A1A"/>
<rect x="0.5" y="104.5" width="175" height="87" rx="9.5" stroke="white" stroke-opacity="0.4"/>
<rect x="12" y="116" width="152" height="8" rx="4" fill="#DBDBDB" fill-opacity="0.6"/>
<rect x="12" y="132" width="46" height="46" rx="4" fill="white" fill-opacity="0.08"/>
<rect x="65" y="132" width="46" height="46" rx="4" fill="white" fill-opacity="0.08"/>
<rect x="118" y="132" width="46" height="46" rx="4" fill="white" fill-opacity="0.08"/>
</g>

<!-- Bottom-right. -->
<g opacity="0.5">
<rect x="200" y="104" width="176" height="88" rx="10" fill="#1A1A1A"/>
<rect x="200.5" y="104.5" width="175" height="87" rx="9.5" stroke="white" stroke-opacity="0.4"/>
<rect x="212" y="116" width="152" height="34" rx="4" fill="white" fill-opacity="0.08"/>
