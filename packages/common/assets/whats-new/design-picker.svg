<svg width="360" height="195" viewBox="0 0 560 384" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="384" fill="black"/>
<rect opacity="0.3" width="560" height="384" fill="url(#design_picker_dot_grid)"/>
<defs>
<pattern id="design_picker_dot_grid" width="28" height="28" patternUnits="userSpaceOnUse">
<rect x="26" y="25" width="3" height="3" rx="1.5" fill="white"/>
</pattern>
<linearGradient id="design_picker_accent" x1="196" y1="96" x2="300" y2="268" gradientUnits="userSpaceOnUse">
<stop stop-color="#3858E9"/>
<stop offset="1" stop-color="#069E08"/>
</linearGradient>
<filter id="design_picker_glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="10"/>
</filter>
</defs>

<!-- Four design options; the chosen one is lit. -->
<g transform="translate(88 96)">

<!-- Top-left: picked. -->
<rect x="-7" y="-7" width="190" height="102" rx="16" fill="#3858E9" opacity="0.16" filter="url(#design_picker_glow)"/>
