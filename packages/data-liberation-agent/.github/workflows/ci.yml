name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep generated bundles out of pull requests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- dist; then
            echo "dist/ is maintained on main by the Release workflow. Restore generated changes to the PR merge-base before committing."
            git diff --stat "${BASE_SHA}...${HEAD_SHA}" -- dist
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify skill driver coverage
        run: |
          missing_drivers=$(grep -rhoE 'run\.mjs [a-z0-9_-]+' skills 2>/dev/null | awk '{print $2}' | sort -u | while read -r name; do
            [[ -f "dist/scripts/${name}.mjs" ]] || echo "$name"
          done)
          if [[ -n "$missing_drivers" ]]; then
            echo "Skills invoke drivers with no committed bundle: ${missing_drivers}"
            exit 1
          fi
      - run: npm run test:package
      - run: npm test
