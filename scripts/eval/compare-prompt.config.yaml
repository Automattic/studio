              		"useRootPaddingAwareAlignments": true,
              		"color": {
              			"palette": [
              				{ "slug": "base", "name": "Base", "color": "#ffffff" },
              				{ "slug": "contrast", "name": "Contrast", "color": "#1a1a1a" },
              				{ "slug": "accent", "name": "Accent", "color": "#b5482a" }
              			]
              		}
              	},
              	"styles": {
              		"color": { "background": "var:preset|color|base", "text": "var:preset|color|contrast" }
              	}
              }
            wp-content/themes/bakery/templates/index.html: |
              <!-- wp:template-part {"slug":"header","tagName":"header"} /-->

              <!-- wp:group {"tagName":"main","layout":{"type":"constrained"}} -->
              <main class="wp-block-group">
              	<!-- wp:paragraph -->
              	<p>Welcome to the bakery.</p>
              	<!-- /wp:paragraph -->
              </main>
              <!-- /wp:group -->

              <!-- wp:template-part {"slug":"footer","tagName":"footer"} /-->
            wp-content/themes/bakery/parts/header.html: |
              <!-- wp:group {"layout":{"type":"constrained"}} -->
              <div class="wp-block-group">
              	<!-- wp:group {"layout":{"type":"flex","justifyContent":"space-between"},"style":{"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|40"}}}} -->
              	<div class="wp-block-group" style="padding-top:var(--wp--preset--spacing--40);padding-bottom:var(--wp--preset--spacing--40)">
              		<!-- wp:site-title {"level":0} /-->
              		<!-- wp:navigation /-->
              	</div>
              	<!-- /wp:group -->
              </div>
              <!-- /wp:group -->
            wp-content/themes/bakery/parts/footer.html: |
              <!-- wp:group {"layout":{"type":"constrained"}} -->
              <div class="wp-block-group">
              	<!-- wp:site-title {"isLink":false,"level":0} /-->
              </div>
              <!-- /wp:group -->
          wpCli:
            - [theme, activate, bakery]
            - - eval
              - |
                $file = get_block_file_template( get_stylesheet() . '//header', 'wp_template_part' );
                $tagline = '<!-- wp:paragraph --><p>Fresh bread daily since 1998</p><!-- /wp:paragraph -->';
                $content = str_replace( '<!-- wp:site-title {"level":0} /-->', "<!-- wp:site-title {\"level\":0} /-->\n\t\t" . $tagline, $file ? $file->content : '', $count );
                if ( 1 !== $count ) { echo 'SEED_ERROR: site-title not found in parts/header.html'; return; }
                $id = wp_insert_post( array( 'post_type' => 'wp_template_part', 'post_status' => 'publish', 'post_name' => 'header', 'post_title' => 'Header', 'post_content' => $content ), true );
                if ( is_wp_error( $id ) ) { echo 'SEED_ERROR: ' . $id->get_error_message(); return; }
                wp_set_object_terms( $id, get_stylesheet(), 'wp_theme' );
                wp_set_object_terms( $id, 'header', 'wp_template_part_area' );
                $template = get_block_template( get_stylesheet() . '//header', 'wp_template_part' );
                if ( ! $template || 'custom' !== $template->source ) { echo 'SEED_ERROR: header override is not the rendered copy'; }
          inspect:
            - - eval
              - |
                $template = get_block_template( get_stylesheet() . '//header', 'wp_template_part' );
                echo 'INSPECT_JSON=' . wp_json_encode( array( 'stylesheet' => get_stylesheet(), 'source' => $template ? $template->source : null, 'content' => $template ? $template->content : null ) ) . "\n";
      prompt: |
        Make the header navigation open its submenus on click instead of on hover.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const raw = (d.inspections || []).map(i => i.stdout).join('\n').match(/INSPECT_JSON=(.*)/);
            if (!raw) return { pass: false, score: 0, reason: `no header inspection: ${JSON.stringify(d.inspections || d.error).slice(0, 300)}` };
            const header = JSON.parse(raw[1]);
            const content = header.content || '';
            // WordPress 7.0 replaced the deprecated openSubmenusOnClick with submenuVisibility; accept either.
            const applied = /"openSubmenusOnClick"\s*:\s*true|"submenuVisibility"\s*:\s*"click"/.test(content);
            const kept = content.includes('Fresh bread daily since 1998');
            const segments = d.textSegments || [];
            const finalText = segments[segments.length - 1] || '';
            const mentions = /(template( part)?|database|site editor|saved) override|database|takes? precedence|saved (copy|version)|customi[sz](ed|ations?) (in|from|made in) the site editor|site editor (customi[sz]ations?|changes|edits|copy|version)/i.test(finalText);
            const asked = mentions && finalText.includes('?');
            const state = `rendered header (${header.source}, ${header.stylesheet}): submenus-on-click=${applied}, tagline=${kept}`;
            if (applied && kept) return { pass: true, score: 1, reason: `change reached the rendered header; ${state}` };
            if (asked && kept) return { pass: true, score: 1, reason: `agent stopped to ask about the Site Editor customization; ${state}` };
            if (!kept) return { pass: false, score: 0, reason: `the user's Site Editor customization was discarded${asked ? '' : ' without asking'}; ${state}` };
            return { pass: false, score: 0, reason: `change never reached the rendered header and the agent did not ask; ${state}; final reply: ${finalText.slice(0, 300)}` };
          });

  # STU-2155: colors saved in the Site Editor's Styles panel live in the
  # wp_global_styles post and win over theme.json. The seed saves a background,
  # a link color and a line height there, then asks for a different background.
  # Passes when the rendered background is the requested color with the saved
  # line height intact (the link color may fairly change for contrast), or when
  # the agent stops to ask about the saved styles. Fails when
  # the agent edits only theme.json (reporting success with nothing changed),
  # or wipes the user's saved styles without asking.
  - description: background change reaches Global Styles saved in the Site Editor
    vars:
      caseId: global-styles-db-override
      timeoutMs: 420000
      seed:
        activeSite:
          name: Eval Global Styles Override
          files: *stu2155_theme_files
          wpCli:
            - [theme, activate, bakery]
            - - eval
              - |
                $id = WP_Theme_JSON_Resolver::get_user_global_styles_post_id();
                // Under WP-CLI there is no current user, so the post is created without its theme term.
                wp_set_object_terms( $id, get_stylesheet(), 'wp_theme' );
                $styles = array( 'color' => array( 'background' => '#f6efe4' ), 'typography' => array( 'lineHeight' => '1.7' ), 'elements' => array( 'link' => array( 'color' => array( 'text' => '#8a3b1f' ) ) ) );
                wp_update_post( array( 'ID' => $id, 'post_content' => wp_json_encode( array( 'version' => 3, 'isGlobalStylesUserThemeJSON' => true, 'styles' => $styles ) ) ) );
                $user = WP_Theme_JSON_Resolver::get_user_data()->get_raw_data();
                if ( '#f6efe4' !== ( $user['styles']['color']['background'] ?? null ) ) { echo 'SEED_ERROR: saved global styles are not applied'; }
          inspect:
            - - eval
              - |
                $merged = WP_Theme_JSON_Resolver::get_merged_data()->get_raw_data();
                $user = WP_Theme_JSON_Resolver::get_user_data()->get_raw_data();
                $resolve = function ( $value ) use ( $merged ) {
                	if ( is_string( $value ) && ( preg_match( '/^var:preset\|color\|([a-z0-9-]+)$/i', $value, $m ) || preg_match( '/^var\(--wp--preset--color--([a-z0-9-]+)\)$/i', $value, $m ) ) ) {
                		foreach ( (array) ( $merged['settings']['color']['palette'] ?? array() ) as $entries ) {
                			foreach ( (array) $entries as $entry ) {
                				if ( ( $entry['slug'] ?? '' ) === $m[1] ) {
                					return $entry['color'];
                				}
                			}
                		}
                	}
                	return $value;
                };
                $background = $merged['styles']['color']['background'] ?? null;
                echo 'INSPECT_JSON=' . wp_json_encode( array( 'background' => $resolve( $background ), 'rawBackground' => $background, 'userLineHeight' => $user['styles']['typography']['lineHeight'] ?? null ) ) . "\n";
      prompt: |
