              <!DOCTYPE html>
              <html lang="en">
              <head><meta charset="utf-8"><title>Courses | Harbor Lights</title><link rel="stylesheet" href="style.css"></head>
              <body>
              <header><a class="logo" href="index.html">Harbor Lights</a><nav><a href="courses.html">Courses</a><a href="about.html">About Us</a></nav></header>
