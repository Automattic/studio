# Studio Code Agent Evaluation
# Run: npm run eval          (builds CLI first)
# View: npm run eval:view
#
# The runner writes its payload to a tmp file and prints only
# `EVAL_RUNNER_RESULT_FILE=/path/to.json` on stdout. Assertions resolve the
# marker via `import('node:fs').then(...)` — not `require('fs')`, which is
# undefined inside promptfoo's assertion eval context.

description: Studio Code agent evaluation

# Tests create/delete real local sites; running them in parallel makes two
# runs fight over ports and on-disk state.
evaluateOptions:
  maxConcurrency: 1

providers:
  - id: exec:node ../../apps/cli/dist/cli/eval-runner.mjs
    label: studio-agent

defaultTest:
  options:
    repeat: 1

tests:
  - description: agent identifies as WordPress Studio AI
    vars:
      caseId: identity
      timeoutMs: 60000
      prompt: In one short sentence, tell me who you are. Do not call any tools.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            if (d.success !== true) return { pass: false, score: 0, reason: `runner success=${d.success}` };
            const text = (d.textSegments || []).join('\n');
            const mentionsStudio = /WordPress\s+Studio/i.test(text);
            const claimsOther = /\bI\s+am\s+(Claude|ChatGPT|a large language model|an AI (model|assistant) (made|built|developed) by Anthropic)\b/i.test(text);
            const pass = mentionsStudio && !claimsOther;
            return {
              pass,
              score: pass ? 1 : 0,
              reason: pass ? 'identifies as WordPress Studio' : `got: ${text.slice(0, 300)}`,
            };
          });

  # The global instructions file (~/.studio/knowledge/instructions.md) is
  # seeded with a sentinel-token rule for the turn and restored afterwards.
  # A compliant agent ends its reply with the token; an agent that never saw
  # the instructions can't produce it.
  - description: agent follows the user's global instructions
    vars:
      caseId: global-instructions
      timeoutMs: 60000
      prompt: In one short sentence, say hello. Do not call any tools.
      seed:
        globalInstructions: |
          Always end every reply with the exact token STUDIO-EVAL-TOKEN-7319.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            if (d.success !== true) return { pass: false, score: 0, reason: `runner success=${d.success}` };
            const text = (d.textSegments || []).join('\n');
            const pass = text.includes('STUDIO-EVAL-TOKEN-7319');
            return {
              pass,
              score: pass ? 1 : 0,
              reason: pass ? 'reply carries the token from the global instructions' : `token missing from reply: ${text.slice(0, 300)}`,
            };
          });

  - description: agent calls site_create when asked to make a site
    vars:
      caseId: site-creation
      timeoutMs: 120000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Test Site" exists using site_list.
        If it does, delete it with site_delete. Then create a new site named "Eval Test Site".
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const called = d.toolCalls?.some(t => t.name === 'site_create');
            return { pass: !!called, score: called ? 1 : 0, reason: called ? 'site_create was called' : `no site_create in ${JSON.stringify(d.toolCalls?.map(t => t.name) ?? [])}` };
          });
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const result = d.toolResults?.find(r => r.toolName === 'site_create');
            const ok = !!(result && !result.isError);
            return { pass: ok, score: ok ? 1 : 0, reason: ok ? 'site_create succeeded' : `site_create result: ${JSON.stringify(result)}` };
          });

  # Regression: trunk handles desktop/mobile visual verification as separate
  # screenshot calls. The optimized tool exposes `viewport: "all"` so the agent
  # can satisfy the same user request with one timed call and two PNG payloads.
  - description: screenshot verification captures desktop and mobile in one fast call
    vars:
      caseId: screenshot-all-timing
      timeoutMs: 240000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Screenshot Timing" exists using
        site_list. If it does, delete it with site_delete so we start from
        a clean slate. Do NOT touch any other site.

        Then create a new site named "Eval Screenshot Timing". Do not
        customize the theme. Verify the homepage visually with screenshots
        for both desktop and mobile, then briefly report whether the
        screenshots were captured.
    assert:
      # The runner records the image content blocks the tool returned to the
      # model (`toolResults[].images`) — unlike the chat artifacts, they are
      # emitted even when the agent passes `display: false`, so the check can't
      # be dodged by an internal-verification capture.
      - type: javascript
        value: |
          return Promise.all([import('node:fs'), import('node:buffer')]).then(([{ readFileSync }, { Buffer }]) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const screenshotCalls = (d.toolCalls || []).filter(t => t.name === 'take_screenshot');
            if (screenshotCalls.length !== 1) {
              return {
                pass: false,
                score: 0,
                reason: `expected one take_screenshot call for desktop+mobile verification, got ${screenshotCalls.length}: ${JSON.stringify(screenshotCalls.map(t => t.input))}`,
              };
            }
            const call = screenshotCalls[0];
            if (call.input?.viewport !== 'all') {
              return {
                pass: false,
                score: 0,
                reason: `expected take_screenshot to use viewport="all"; got ${JSON.stringify(call.input)}`,
              };
            }

            const result = (d.toolResults || []).find(r => r.toolUseId === call.id);
            if (!result || result.isError) {
              return { pass: false, score: 0, reason: `take_screenshot failed: ${JSON.stringify(result).slice(0, 500)}` };
            }
            const images = result.images || [];
            if (images.length !== 2) {
              return { pass: false, score: 0, reason: `expected two screenshot image payloads (desktop + mobile), got ${images.length}` };
            }

            // Image blocks carry no viewport label, so identify each capture by
            // its pixel width (keyed by viewport, so the check survives a future
            // image-format change).
            const expectedWidths = new Map([
              [1040, 'desktop'],
              [390, 'mobile'],
            ]);
            // Read pixel dimensions from a PNG or JPEG buffer; null if neither.
            const readImageSize = (buf) => {
              if (buf.length > 24 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4e && buf[3] === 0x47) {
                return { format: 'png', width: buf.readUInt32BE(16), height: buf.readUInt32BE(20) };
              }
              if (buf.length > 4 && buf[0] === 0xff && buf[1] === 0xd8) {
                let offset = 2;
                while (offset + 9 < buf.length) {
                  if (buf[offset] !== 0xff) { offset++; continue; }
                  const marker = buf[offset + 1];
                  // Markers without a length payload: skip past them.
                  if (marker === 0xd8 || marker === 0xd9 || (marker >= 0xd0 && marker <= 0xd7) || marker === 0x01) {
                    offset += 2;
                    continue;
                  }
                  // Start-of-frame markers carry the dimensions (excluding DHT/JPG/DAC).
                  if (marker >= 0xc0 && marker <= 0xcf && marker !== 0xc4 && marker !== 0xc8 && marker !== 0xcc) {
                    return { format: 'jpeg', height: buf.readUInt16BE(offset + 5), width: buf.readUInt16BE(offset + 7) };
                  }
                  offset += 2 + buf.readUInt16BE(offset + 2);
                }
              }
              return null;
            };
            const seen = [];
            for (const image of images) {
              const size = readImageSize(Buffer.from(image.data, 'base64'));
              const viewport = size ? expectedWidths.get(size.width) : undefined;
              if (!viewport || size.height < 600) {
                return {
                  pass: false,
                  score: 0,
                  reason: `image payload did not look like a desktop/mobile screenshot: ${JSON.stringify(size)}`,
                };
              }
              if (seen.includes(viewport)) {
                return { pass: false, score: 0, reason: `two ${viewport} screenshots instead of desktop + mobile` };
              }
              seen.push(viewport);
            }
            return { pass: true, score: 1, reason: `captured valid screenshots: ${seen.join(', ')}` };
          });
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const events = (d.toolEvents || []).filter(t => t.toolName === 'take_screenshot');
            if (events.length !== 1 || typeof events[0].durationMs !== 'number') {
              return { pass: false, score: 0, reason: `expected one timed take_screenshot event, got ${JSON.stringify(events)}` };
            }
            const limitMs = 15000;
            const duration = events[0].durationMs;
            const pass = duration < limitMs;
            return {
              pass,
              score: pass ? 1 : 0,
              reason: pass
                ? `take_screenshot completed in ${duration}ms`
                : `take_screenshot took ${duration}ms, expected < ${limitMs}ms`,
            };
          });

  # Every individual turn (wall-clock between successive assistant messages)
  # should stay under 60s. Slow turns stall the UI.
  - description: single-page site build keeps every turn under 60s
    vars:
      caseId: single-page-build-turn-cadence
      timeoutMs: 600000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Turn Timing" exists using
        site_list. If it does, delete it with site_delete so we start from
        a clean slate. Do NOT touch any other site.

        Then build a simple WordPress site named "Eval Turn Timing". The
        site only needs a single page — no extra pages, no blog posts, no
        navigation menu beyond what a one-page site requires.
    assert:
      # The default new-site flow: no installed theme is mentioned, so the
      # agent must start from a fresh blank scaffold — scaffold_theme called
      # WITHOUT parentTheme (the parentTheme path is covered by the
      # child-theme-for-installed-theme case below).
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const scaffolds = (d.toolCalls || []).filter(t => t.name === 'scaffold_theme');
            if (scaffolds.length === 0) {
              return { pass: false, score: 0, reason: `scaffold_theme was never called; tools: ${JSON.stringify((d.toolCalls || []).map(t => t.name))}` };
            }
            const call = scaffolds[0];
            if (call.input?.parentTheme) {
              return { pass: false, score: 0, reason: `expected a blank scaffold but got a child theme: ${JSON.stringify(call.input)}` };
            }
            const result = (d.toolResults || []).find(r => r.toolUseId === call.id);
            if (!result || result.isError) {
              return { pass: false, score: 0, reason: `scaffold_theme failed: ${JSON.stringify(result).slice(0, 300)}` };
            }
            return { pass: true, score: 1, reason: `blank theme scaffolded: ${JSON.stringify(call.input)}` };
          });
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const durations = d.turnDurationsMs ?? [];
            if (durations.length === 0) {
              return { pass: false, score: 0, reason: 'no turns recorded' };
            }
            const max = Math.max(...durations);
            const maxIdx = durations.indexOf(max);
            if (max >= 60000) {
              return { pass: false, score: 0, reason: `turn ${maxIdx + 1}/${durations.length} took ${max}ms (>= 60000ms). All turns (ms): ${durations.join(', ')}` };
            }
            return { pass: true, score: 1, reason: `max turn ${max}ms across ${durations.length} turns` };
          });
      # Regression: the "Page content" cadence used to tell the agent to apply
      # page blocks via `wp_cli post update --post_content-file=<host path>`.
      # `wp_cli` runs inside the PHP-WASM filesystem, so host paths silently
      # resolve to empty content and the post is overwritten with nothing.
      # The fix is `wp_cli eval` + `file_get_contents(ABSPATH . ...)` — this
      # assertion fails if any wp_cli call reintroduces --post_content-file=.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const offending = (d.toolCalls || []).filter(t => {
              if (t.name !== 'wp_cli') return false;
              const cmd = t.input && typeof t.input.command === 'string' ? t.input.command : '';
              return cmd.includes('--post_content-file=');
            });
            if (offending.length > 0) {
              const sample = JSON.stringify(offending[0].input).slice(0, 300);
              return { pass: false, score: 0, reason: `${offending.length} wp_cli call(s) used --post_content-file=, which silently fails inside PHP-WASM (first: ${sample})` };
            }
            return { pass: true, score: 1, reason: 'no wp_cli call used --post_content-file=' };
          });
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const validationResults = (d.toolResults || []).filter(r => r.toolName === 'validate_blocks');
            if (validationResults.length === 0) {
              return { pass: false, score: 0, reason: 'validate_blocks was not called for block content' };
            }
            const last = validationResults[validationResults.length - 1];
            const text = last.text || '';
            // validate_blocks runs the core/html policy gate first; only when it
            // passes does the live-editor validation run and emit `Validation:`.
            // A short-circuited result reports `N/M core/html blocks invalid`.
            const htmlPassed = /HTML block policy:/i.test(text) && !/core\/html blocks invalid/i.test(text);
            if (last.isError || !htmlPassed) {
              return {
                pass: false,
                score: 0,
                reason: `final validate_blocks result did not pass the core/html policy gate: ${(text || JSON.stringify(last)).slice(0, 500)}`,
              };
            }
            const failed =
              !/Validation:\s+\d+\/\d+\s+blocks valid/i.test(text) ||
              /Auto-fix proposal failed validation|Auto-fix proposal still has|No automatic editor serialization fix was available/i.test(text);
            if (failed) {
              return {
                pass: false,
                score: 0,
                reason: `final validate_blocks editor validation was invalid or inconclusive: ${(text || JSON.stringify(last)).slice(0, 500)}`,
              };
            }
            return { pass: true, score: 1, reason: `validation passed: ${text.split(/\r?\n/).filter(Boolean).slice(0, 2).join(' | ')}` };
          });

      # The visual-design skill injects a random concept shortlist per role; the
      # agent must load it and commit to a moment, a system, and a detail
      # concept in the Site Spec before building.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const loaded = (d.toolCalls || []).some(t => t.name === 'Skill' && t.input?.name === 'visual-design');
            if (!loaded) return { pass: false, score: 0, reason: 'visual-design skill was never loaded' };
            const lines = (d.textSegments || []).join('\n').split(/\r?\n/).filter(l => /\bConcept\b/i.test(l));
            const missing = ['moment', 'system', 'detail'].filter(role => !lines.some(l => new RegExp(`\\bConcept\\b[^\\n]{0,12}\\b${role}\\b`, 'i').test(l)));
            if (missing.length) return { pass: false, score: 0, reason: `no Concept line for: ${missing.join(', ')}; concept lines: ${JSON.stringify(lines.slice(0, 5))}` };
            // Inventing is the exception; at least two of the three picks must name a catalog entry.
            const catalogPath = ['apps/cli/ai/skills/visual-design/concepts.md', '../../apps/cli/ai/skills/visual-design/concepts.md'].find(p => { try { readFileSync(p); return true; } catch { return false; } });
            if (!catalogPath) return { pass: false, score: 0, reason: `concepts catalog not found from cwd ${process.cwd()}` };
            const catalog = readFileSync(catalogPath, 'utf8').match(/^#### (.+)$/gm).map(h => h.slice(5).trim().toLowerCase());
            const fromCatalog = lines.filter(l => catalog.some(name => l.toLowerCase().includes(name)));
            if (fromCatalog.length < 2) return { pass: false, score: 0, reason: `only ${fromCatalog.length} concept line(s) name a catalog entry: ${JSON.stringify(lines.slice(0, 5))}` };
            return { pass: true, score: 1, reason: `concepts stated: ${lines.map(l => l.trim().slice(0, 80)).join(' | ').slice(0, 300)}` };
          });

  # One-page sites get header navigation that links to page sections. The
  # header template part renders on EVERY template (posts, archives, search,
  # 404), and a bare-hash URL like "#contact" resolves against the current
  # URL — it silently does nothing everywhere except the home page. Anchor
  # nav links must be home-relative ("/#contact"). Regression guard for the
  # one-page navigation guidance in the block-content skill.
  - description: one-page site header nav uses home-relative anchor links
    vars:
      caseId: one-page-nav-anchor-links
      timeoutMs: 600000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval One Page Nav" exists using
        site_list. If it does, delete it with site_delete so we start from a
        clean slate. Do NOT touch any other site.

        Then build a one-page site named "Eval One Page Nav": a single
        scrollable home page with Features, About, and Contact sections, and
        a header navigation menu whose items jump to those sections. Keep the
        design simple — no extra pages and no blog posts.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const strings = [];
            const collect = (v) => {
              if (typeof v === 'string') strings.push(v);
              else if (Array.isArray(v)) v.forEach(collect);
              else if (v && typeof v === 'object') Object.values(v).forEach(collect);
            };
            (d.toolCalls || []).forEach(t => collect(t.input));
            // wp_cli payloads carry markup with shell/JSON-escaped quotes;
            // strip backslashes so one regex covers theme files and commands.
            const flat = strings.map(s => s.replace(/\\/g, ''));
            const links = flat.flatMap(s => s.match(/wp:navigation-link\s*\{[^}]*\}/g) || []);
            if (links.length === 0) {
              return { pass: false, score: 0, reason: 'no wp:navigation-link blocks were produced — the build did not exercise header section navigation' };
            }
            const anchorLinks = links.filter(l => /"url":"[^"]*#/.test(l));
            if (anchorLinks.length === 0) {
              return { pass: false, score: 0, reason: `nav links carry no anchor URLs at all — the section-jump scenario was not exercised (links: ${links.slice(0, 3).join(' | ').slice(0, 300)})` };
            }
            const bare = links.filter(l => /"url":"#/.test(l));
            if (bare.length > 0) {
              return { pass: false, score: 0, reason: `${bare.length}/${links.length} nav link(s) use bare-hash URLs, which resolve against the current URL and break on every page except home (first: ${bare[0].slice(0, 200)}). Anchor nav links must be home-relative ("/#anchor").` };
            }
            return { pass: true, score: 1, reason: `${anchorLinks.length} anchor nav link(s), all home-relative` };
          });

  # Regression (STU-1775): the agent used to present a temporary preview site as
  # a connected WordPress.com remote site when listing what a local site is
  # connected to. We seed one connected remote site and one preview site for a
  # local site, then assert (a) each tool tags its output with a `type`
  # discriminator and (b) the agent's prose keeps the two categories distinct.
  - description: agent distinguishes preview sites from connected WordPress.com remote sites
    vars:
      caseId: differentiate-preview-vs-remote
      timeoutMs: 180000
      askUserPolicy: allow_all
      seed:
        localSite:
          id: eval-site-categories
          name: Eval Site Categories
          path: /tmp/eval-site-categories
          port: 8881
        connectedWpcomSites:
          - id: 111
            localSiteId: eval-site-categories
            name: My Production Site
            url: https://myprod.wordpress.com
            isStaging: false
            isPressable: false
            environmentType: production
            syncSupport: already-connected
            lastPullTimestamp: null
            lastPushTimestamp: null
        snapshots:
          - url: abc123-studio.wp.build
            atomicSiteId: 111
            localSiteId: eval-site-categories
            date: 1900000000000
            name: Eval Site Categories
      prompt: |
        For the local site named "Eval Site Categories", list everything it is
        connected or related to. For each item, tell me clearly whether it is a
        temporary PREVIEW site or a durable connected WordPress.com remote site.
        Do not create, delete, or modify anything — only inspect and report.
    assert:
      # The connected-remote tool output carries the type discriminator.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const r = (d.toolResults || []).find(r => r.toolName === 'site_connected_remote_sites');
            if (!r) return { pass: false, score: 0, reason: `site_connected_remote_sites was not called; tools: ${JSON.stringify((d.toolCalls || []).map(t => t.name))}` };
            const ok = /"type"\s*:\s*"wpcom-remote"/.test(r.text || '');
            return { pass: ok, score: ok ? 1 : 0, reason: ok ? 'connected-remote output tagged type=wpcom-remote' : `missing type discriminator: ${(r.text || '').slice(0, 300)}` };
          });
      # The preview tool output carries the type discriminator.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
