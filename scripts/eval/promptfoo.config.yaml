        value: file://outcome.mjs:otherSitesUntouched

  # Debugging, as users report it: a snippet pasted into the theme's
  # functions.php has a syntax error, so every page is blank. Passes when the
  # site renders and the snippet's banner shows on the home page.
  - description: a white screen from a pasted functions.php snippet is fixed with the snippet working
    vars:
      caseId: debug-functions-snippet
      plugins: []
      homeText: [{ text: Free delivery on orders over $30 }]
      timeoutMs: 600000
      seed:
        activeSite:
          name: Copper Kettle Tea
          files:
            wp-content/themes/copper-kettle/style.css: |
              /*
              Theme Name: Copper Kettle
              Template: twentytwentyfive
              Version: 1.0.0
              */
              .delivery-banner { padding: 8px; text-align: center; background: #b5651d; color: #fff; }
            wp-content/themes/copper-kettle/functions.php: |
              <?php
              add_action( 'wp_enqueue_scripts', function () {
              	wp_enqueue_style( 'copper-kettle', get_stylesheet_uri() );
              } );

              // Free delivery banner at the top of every page.
              add_action( 'wp_body_open', 'ck_delivery_banner' )
              function ck_delivery_banner() {
              	echo '<div class="delivery-banner">Free delivery on orders over $30</div>';
              }
          wpCli:
            - [theme, activate, copper-kettle]
      prompt: |
        I pasted a snippet from a tutorial into my theme's functions.php to show a
        free delivery banner, and now my whole site is just a white page. Help!
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:featureStillWorks
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # A redesign of an existing site on a WordPress.org theme: the user's home
  # page content stays, and the new look is kept where WordPress keeps a
  # design. Passes when the home page still shows the content and the design
  # is the site's own.
  - description: a plain existing site gets a distinctive look and keeps its content
    vars:
      caseId: redesign-existing-site
      plugins: []
      homeText:
        - text: Wood-fired sourdough pizza since 2011
        - text: Tuesday to Sunday, 5pm to 10pm
      timeoutMs: 900000
      seed:
        activeSite:
          name: Ember Street Pizza
          wpCli:
            - [theme, activate, twentytwentyfive]
            - - eval
              - |
                $content = "<!-- wp:heading {\"level\":1} -->\n<h1 class=\"wp-block-heading\">Ember Street Pizza</h1>\n<!-- /wp:heading -->\n\n<!-- wp:paragraph -->\n<p>Wood-fired sourdough pizza since 2011</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Our menu</h2>\n<!-- /wp:heading -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Margherita, $14</li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Fennel sausage and honey, $17</li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Wild mushroom and taleggio, $18</li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Hours</h2>\n<!-- /wp:heading -->\n\n<!-- wp:paragraph -->\n<p>Tuesday to Sunday, 5pm to 10pm</p>\n<!-- /wp:paragraph -->";
                $page = wp_insert_post( array( 'post_type' => 'page', 'post_status' => 'publish', 'post_title' => 'Home', 'post_content' => $content ), true );
                if ( is_wp_error( $page ) ) { echo 'SEED_ERROR: ' . $page->get_error_message(); return; }
                update_option( 'show_on_front', 'page' );
                update_option( 'page_on_front', $page );
      prompt: |
        My pizza place's site looks really plain and generic. Can you give it a
        warmer, more distinctive look that feels like a wood-fired pizzeria? Keep
        all my content.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:featureStillWorks
      - type: javascript
        value: file://outcome.mjs:siteHasItsOwnDesign
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched
