# Studio Code Agent Evaluation
# Run: npm run eval          (builds CLI first)
# View: npm run eval:view
#
# Cases are judged on outcomes: the site the turn leaves behind (WordPress
# state, rendered home page, block validity, theme files), the other sites it
# left alone, and what the user was told. The runner captures that state after
# the turn; the checks live in outcome.mjs and read their parameters from the
# case's vars. The site judged is the seeded active site the request is about,
# or else the one the turn created.
#
# Prompts read as a user would write them. The scripted user (answers in
# defaultTest, eval-answers.ts) leaves the choices to the agent, keeps to
# WordPress's default of a block theme, and declines what it does not fit;
# a case overrides it to test a particular answer.

description: Studio Code agent evaluation

# Each case creates its sites in its own folder and gives them ports from a
# range of its own (eval-port-range.ts), so cases run side by side.
evaluateOptions:
  maxConcurrency: 4

providers:
  - id: exec:node ../../apps/cli/dist/cli/eval-runner.mjs
    label: studio-agent

defaultTest:
  options:
    repeat: 1
  vars:
    answers:
      - when: 'classic theme'
        label: 'No'
      - label: 'Whatever you think is best.'

tests:
  - description: agent identifies as WordPress Studio AI
    vars:
      caseId: identity
      timeoutMs: 60000
      prompt: In one short sentence, tell me who you are. Do not call any tools.
    assert:
      - type: javascript
        value: file://outcome.mjs:identifiesAsStudio

  # The global instructions file (~/.studio/knowledge/instructions.md) is
  # seeded with a sentinel-token rule for the turn and restored afterwards.
  # A compliant agent ends its reply with the token; an agent that never saw
  # the instructions can't produce it.
  - description: agent follows the user's global instructions
    vars:
      caseId: global-instructions
      expectedText: STUDIO-EVAL-TOKEN-7319
      timeoutMs: 60000
      prompt: In one short sentence, say hello. Do not call any tools.
      seed:
        globalInstructions: |
          Always end every reply with the exact token STUDIO-EVAL-TOKEN-7319.
    assert:
      - type: javascript
        value: file://outcome.mjs:replyIncludes

  - description: asking for a site leaves a working new site
    vars:
      caseId: site-creation
      timeoutMs: 120000
      prompt: |
        Create a new site named "Maple Street Books".
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # The model must see a desktop and a mobile capture of the home page, with
  # the screenshot time summed across however many calls it made. Pinned to
  # an image-capable tier: text-only models get files, not image payloads.
  - description: screenshot verification shows the model desktop and mobile quickly
    vars:
      caseId: screenshot-all-timing
      model: balanced
      timeoutMs: 240000
      prompt: |
        Create a new site called "Northwind Notes" and keep the theme it comes
        with. Check the homepage on desktop and on mobile with screenshots,
        and tell me briefly how it looks.
    assert:
      - type: javascript
        value: file://outcome.mjs:sawDesktopAndMobile
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # A fresh build: the site renders with valid blocks, has a static front
  # page, and runs its own theme with self-hosted fonts and a real
  # screenshot. Every turn stays under 60s so the UI never stalls.
  - description: single-page build leaves a working site with its own design
    vars:
      caseId: single-page-build-turn-cadence
      timeoutMs: 600000
      prompt: |
        Build a simple one-page website for Juniper & Oak, a small furniture
        workshop. Just the one page: no blog and no extra pages.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:builtFrontPage
      - type: javascript
        value: file://outcome.mjs:siteHasItsOwnDesign
      - type: javascript
        value: file://outcome.mjs:turnsAreResponsive
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  - description: single-page variant ceramics
    vars:
      caseId: single-page-variant-ceramics
      timeoutMs: 600000
      prompt: |
        Build a simple one-page website for Saltmarsh Ceramics, a two-person pottery
        studio. Just the one page.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:builtFrontPage
      - type: javascript
        value: file://outcome.mjs:siteHasItsOwnDesign
      - type: javascript
        value: file://outcome.mjs:turnsAreResponsive
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  - description: single-page variant dog-grooming
    vars:
      caseId: single-page-variant-dog-grooming
      timeoutMs: 600000
      prompt: |
        I need a website for my dog-grooming business, Tidy Paws. One page is fine.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:builtFrontPage
      - type: javascript
        value: file://outcome.mjs:siteHasItsOwnDesign
      - type: javascript
        value: file://outcome.mjs:turnsAreResponsive
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  - description: single-page variant bakery
    vars:
      caseId: single-page-variant-bakery
      timeoutMs: 600000
      prompt: |
        One-page site for Harbor Lane Bakery: our hours are Tue–Sun 7–2, we're at
        14 Harbor Lane, and we take custom cake orders by email. No blog.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:builtFrontPage
      - type: javascript
        value: file://outcome.mjs:siteHasItsOwnDesign
      - type: javascript
        value: file://outcome.mjs:turnsAreResponsive
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  - description: single-page variant climbing-gym
    vars:
      caseId: single-page-variant-climbing-gym
      timeoutMs: 600000
      prompt: |
        Build a one-page site for Northwind Climbing Gym. Dark, bold, energetic.
        Just one page.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:builtFrontPage
      - type: javascript
        value: file://outcome.mjs:siteHasItsOwnDesign
      - type: javascript
        value: file://outcome.mjs:turnsAreResponsive
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # The header renders on every template, so a bare "#contact" only works on
  # the home page. Judged on the rendered home page: section links are
  # home-relative and each target id exists.
  - description: one-page site section links work from every page
    vars:
      caseId: one-page-nav-anchor-links
      timeoutMs: 600000
      prompt: |
        Build a one-page site for Brightline Bikes: one scrolling home page
        with Features, About and Contact sections, and a header menu that
        jumps to each section. Keep it simple, with no extra pages or blog.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:navAnchorsWorkEverywhere
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Regression (STU-1775): a preview site was presented as a connected
  # WordPress.com site. Judged on the reply: the preview is described as a
  # preview, the connected site as a WordPress.com remote site.
  - description: reply tells preview sites apart from connected WordPress.com sites
    vars:
      caseId: differentiate-preview-vs-remote
      timeoutMs: 180000
      seed:
        localSite:
          id: eval-site-categories
          name: Harbor Lights
          path: /tmp/eval-site-categories
          port: 8881
        connectedWpcomSites:
          - id: 111
            localSiteId: eval-site-categories
            name: My Production Site
            url: https://myprod.wordpress.com
            isStaging: false
            isPressable: false
            environmentType: production
            syncSupport: already-connected
            lastPullTimestamp: null
            lastPushTimestamp: null
        snapshots:
          - url: abc123-studio.wp.build
            atomicSiteId: 111
            localSiteId: eval-site-categories
            date: 1900000000000
            name: Harbor Lights
      prompt: |
        For the local site named "Harbor Lights", list everything it is
        connected or related to. For each item, tell me clearly whether it is a
        temporary PREVIEW site or a durable connected WordPress.com remote site.
        Do not create, delete, or modify anything — only inspect and report.
    assert:
      - type: javascript
        value: file://outcome.mjs:classifiesPreviewAndRemote
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # A push reaches a live site, so the agent asks first. The user declines
  # whatever it asks, and nothing may reach WordPress.com.
  - description: push request asks before pushing
    vars:
      caseId: push-confirms-target
      timeoutMs: 180000
      answers:
        - label: Cancel
      seed:
        localSite:
          id: eval-site-push
          name: Lakeside Studio
          path: /tmp/eval-site-push
          port: 8882
        connectedWpcomSites:
          - id: 112
            localSiteId: eval-site-push
            name: My Production Site
            url: https://myprod.wordpress.com
            isStaging: false
            isPressable: false
            environmentType: production
            syncSupport: already-connected
            lastPullTimestamp: null
            lastPushTimestamp: null
      prompt: |
        Push my local site "Lakeside Studio" to WordPress.com.
    assert:
      - type: javascript
        value: file://outcome.mjs:pushNotRunAndAsks

  - description: slideshow request puts a slideshow on the home page
    vars:
      caseId: jetpack-catchall-slideshow
      timeoutMs: 600000
      prompt: |
        Create a new site called "Seaside Gallery" and add a slideshow of
        three placeholder images to its homepage.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:slideshowOnHomePage
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Regression: a "shop"/"store" request framed with qualifiers ("small",
  # "for inspiration") must still end with a working store: WooCommerce
  # active, its shop page published, and a dog and a cat product that
  # WooCommerce shows in the catalog and lets a visitor buy.
  - description: shop request leaves WooCommerce with products for sale
    vars:
      caseId: woocommerce-shop-setup
      minProducts: 2
      timeoutMs: 600000
      prompt: |
        Build a small online pet shop called "Paws & Whiskers", just a couple
        of pages with the feel of a clean modern store. I want to sell dog and
        cat products.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:storeHasProducts
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # A contact page works when a visitor's message reaches the site: the
  # runner sends each published page's message form as a visitor would, and
  # the check passes when the message is stored (whichever plugin stores it)
  # from a form that is not a Custom HTML block.
  - description: contact page takes a visitor's message and the site stores it
    vars:
      caseId: contact-form-works
      timeoutMs: 600000
      seed:
        activeSite:
          name: Crumb & Co
          wpCli:
            - [theme, activate, twentytwentyfive]
      prompt: |
        Add a Contact page to my bakery site where customers can send us a
        message.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:contactFormWorks
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # A newsletter signup in the footer is an email form built from blocks,
  # shown on every page through the footer.
  - description: newsletter signup in the footer is an email form built from blocks
    vars:
      caseId: newsletter-signup
      timeoutMs: 600000
      seed:
        activeSite:
          name: Crumb & Co
          wpCli:
            - [theme, activate, twentytwentyfive]
      prompt: |
        Add a newsletter signup to the footer so visitors can subscribe.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:newsletterSignupInFooter
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Regression (STU-2017): edits to an installed theme are lost on its next
  # update. The theme must still match its WordPress.org release, and the
  # heading font lives where an update keeps it: a child theme, or Global Styles.
  - description: customizing an installed theme leaves it as released and works through a child theme or Global Styles
    vars:
      caseId: child-theme-for-installed-theme
      parentTheme: ollie
      timeoutMs: 600000
      prompt: |
        Create a new site called "Fern & Field", install the Ollie theme from
        WordPress.org, and customize the design: serif headings and a warmer
        color palette. Only typography and color for now, no new pages or
        content.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:customizedThroughChildTheme
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Hardcoded hex detaches a section from Global Styles, theme switching
  # and style variations. Judged on what the turn added (pages, saved
  # templates, custom CSS, theme files changed from the release).
  - description: added sections take their colors from the theme palette
    vars:
      caseId: section-uses-theme-palette
      theme: twentytwentyfive
      timeoutMs: 600000
      prompt: |
        Create a new site called "Copper Kettle Café" and keep the theme it
        comes with. Add two sections to the homepage: a hero with a colored
        background and a heading, and a call to action with a contrasting
        colored background and a button. The colors should feel like they
        belong to the theme.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:colorsFromPalette
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Constrained layouts center children with auto margins, which only work
  # on block-level boxes. Judged on the site's CSS and content: no block
  # wrapper class is given an inline-level display.
  - description: hero eyebrow pill keeps content-column alignment
    vars:
      caseId: inline-block-constrained-alignment
      timeoutMs: 600000
      prompt: |
        Build a simple one-page site for Summit Coaching. The homepage needs a
        full-width hero whose content stays in the normal content column: a
        small uppercase label styled as a pill (a rounded background that hugs
        the text) above the main heading, then the heading and a short
        subtitle. Keep the rest of the page minimal.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:noInlineDisplayOnBlockWrappers
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # A treatment repeated across blocks belongs in a block style variation,
  # so it shows in the editor's Styles panel. Judged on the site: a
  # registered variation is applied to the cards.
  - description: repeated card treatment is a registered block style variation
    vars:
      caseId: repeated-treatment-uses-block-style
      timeoutMs: 600000
      prompt: |
        Create a new site for my coffee shop, Ember Roasters, with a fresh
        custom theme and a simple homepage. It needs a features section of
        three cards that share the same look: same background, rounded
        corners, padding and shadow.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:repeatedTreatmentIsBlockStyle
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Site pick: with an active site and a prompt that names no other site, the
  # agent builds into the active site instead of asking whether to create a
  # separate one. Seeds a real running site as the active site.
  - description: a plan-only request on the active site creates no new site
    vars:
      caseId: active-site-reused
      timeoutMs: 180000
      seed:
        activeSite:
          name: Sunrise Bakery
      prompt: |
        Build me a minimal one-page site for my neighborhood bakery: a hero
        and a short about section. Show me your plan before you write
        anything; I'll confirm it first.
    assert:
      - type: javascript
        value: file://outcome.mjs:noSiteCreated
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # Site pick: with an active site and a prompt that names a different site,
  # the user is asked whether to update the active site or create a new one
  # before either happens. The user dismisses whatever is asked.
  - description: a different site name asks before using or replacing the active site
    vars:
      caseId: active-site-different-name
      timeoutMs: 180000
      answers: []
      seed:
        activeSite:
          name: Corner Crumb
      prompt: |
        Build a one-page site named "Joe's Bakery".
    assert:
      - type: javascript
        value: file://outcome.mjs:asksCurrentOrNew
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # An annotation left on the preview's Design system page names a preset of
  # the site's Styles, as theme.json names it. Passes when WordPress resolves
  # the preset to a new color.
  - description: design system annotation changes the preset WordPress resolves
    vars:
      caseId: design-system-annotation
      slug: accent-1
      originalValue: '#FFEE58'
      timeoutMs: 420000
      seed:
        activeSite:
          name: Calm Corner
      prompt: |
        The user submitted 1 visual annotation from the site preview.

        Make the requested changes. When there are several annotations, address them in the order they were submitted.

        When you reference an annotation for the user, identify the element by what is visible on the page rather than by selector. Use selectors and raw annotation data only for implementation.

        ## Submitted Annotations

        ### 1. design token `var:preset|color|accent-1` - "accent-1: #FFEE58"
        - Page: Design system (the site's Styles)
        - Comment: Make this accent a warm terracotta instead of this yellow.

        ```json
        {
          "id": "a_1",
          "comment": "Make this accent a warm terracotta instead of this yellow.",
          "nearbyText": "accent-1: #FFEE58",
          "designToken": "var:preset|color|accent-1",
          "timestamp": 1790000000000
        }
        ```
    assert:
      - type: javascript
        value: file://outcome.mjs:presetColorChanged
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # STU-2155: once a template part is customized in the Site Editor, WordPress
  # renders the database copy (a wp_template_part post) instead of the theme
  # file. The seed customizes the header the way a user would (the theme's own
  # header plus a tagline), then asks for a header change that has no visible
  # effect to check with a screenshot. Passes when the change reaches the
  # rendered header with the user's tagline intact, or when the agent stops to
  # ask about the customization. Fails when the agent edits only
  # parts/header.html (reporting success with nothing changed), or drops the
  # tagline without asking.
  - description: header change reaches a template part customized in the Site Editor
    vars:
      caseId: template-part-db-override
      timeoutMs: 420000
      seed:
        activeSite:
          name: Golden Crust Bakery
          files: &stu2155_theme_files
            wp-content/themes/bakery/style.css: |
              /*
              Theme Name: Bakery
              Description: A custom block theme scaffolded by Studio Code.
              Requires at least: 6.7
              Tested up to: 6.9
              Requires PHP: 7.2
              Version: 0.1.0
              License: GNU General Public License v2 or later
              License URI: http://www.gnu.org/licenses/gpl-2.0.html
              Text Domain: bakery
              */
            wp-content/themes/bakery/functions.php: |
              <?php
              /**
               * Bakery theme functions.
               *
               * @package bakery
               */

              add_action( 'wp_enqueue_scripts', function () {
              	wp_enqueue_style(
              		'bakery-style',
              		get_parent_theme_file_uri( 'style.css' ),
              		array(),
              		wp_get_theme()->get( 'Version' )
              	);
              } );

              add_action( 'after_setup_theme', function () {
              	add_editor_style( 'style.css' );
              } );
            wp-content/themes/bakery/theme.json: |
              {
              	"$schema": "https://schemas.wp.org/wp/6.7/theme.json",
              	"version": 3,
              	"settings": {
              		"appearanceTools": true,
              		"layout": { "contentSize": "1000px", "wideSize": "1280px" },
              		"useRootPaddingAwareAlignments": true,
              		"color": {
              			"palette": [
              				{ "slug": "base", "name": "Base", "color": "#ffffff" },
              				{ "slug": "contrast", "name": "Contrast", "color": "#1a1a1a" },
              				{ "slug": "accent", "name": "Accent", "color": "#b5482a" }
              			]
              		}
              	},
              	"styles": {
              		"color": { "background": "var:preset|color|base", "text": "var:preset|color|contrast" }
              	}
              }
            wp-content/themes/bakery/templates/index.html: |
              <!-- wp:template-part {"slug":"header","tagName":"header"} /-->

              <!-- wp:group {"tagName":"main","layout":{"type":"constrained"}} -->
              <main class="wp-block-group">
              	<!-- wp:paragraph -->
              	<p>Welcome to the bakery.</p>
              	<!-- /wp:paragraph -->
              </main>
              <!-- /wp:group -->

              <!-- wp:template-part {"slug":"footer","tagName":"footer"} /-->
            wp-content/themes/bakery/parts/header.html: |
              <!-- wp:group {"layout":{"type":"constrained"}} -->
              <div class="wp-block-group">
              	<!-- wp:group {"layout":{"type":"flex","justifyContent":"space-between"},"style":{"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|40"}}}} -->
              	<div class="wp-block-group" style="padding-top:var(--wp--preset--spacing--40);padding-bottom:var(--wp--preset--spacing--40)">
              		<!-- wp:site-title {"level":0} /-->
              		<!-- wp:navigation /-->
              	</div>
              	<!-- /wp:group -->
              </div>
              <!-- /wp:group -->
            wp-content/themes/bakery/parts/footer.html: |
              <!-- wp:group {"layout":{"type":"constrained"}} -->
              <div class="wp-block-group">
              	<!-- wp:site-title {"isLink":false,"level":0} /-->
              </div>
              <!-- /wp:group -->
          wpCli:
            - [theme, activate, bakery]
            - - eval
              - |
                $file = get_block_file_template( get_stylesheet() . '//header', 'wp_template_part' );
                $tagline = '<!-- wp:paragraph --><p>Fresh bread daily since 1998</p><!-- /wp:paragraph -->';
                $content = str_replace( '<!-- wp:site-title {"level":0} /-->', "<!-- wp:site-title {\"level\":0} /-->\n\t\t" . $tagline, $file ? $file->content : '', $count );
                if ( 1 !== $count ) { echo 'SEED_ERROR: site-title not found in parts/header.html'; return; }
                $id = wp_insert_post( array( 'post_type' => 'wp_template_part', 'post_status' => 'publish', 'post_name' => 'header', 'post_title' => 'Header', 'post_content' => $content ), true );
                if ( is_wp_error( $id ) ) { echo 'SEED_ERROR: ' . $id->get_error_message(); return; }
                wp_set_object_terms( $id, get_stylesheet(), 'wp_theme' );
                wp_set_object_terms( $id, 'header', 'wp_template_part_area' );
                $template = get_block_template( get_stylesheet() . '//header', 'wp_template_part' );
                if ( ! $template || 'custom' !== $template->source ) { echo 'SEED_ERROR: header override is not the rendered copy'; }
          inspect:
            - - eval
              - |
                $template = get_block_template( get_stylesheet() . '//header', 'wp_template_part' );
                echo 'INSPECT_JSON=' . wp_json_encode( array( 'stylesheet' => get_stylesheet(), 'source' => $template ? $template->source : null, 'content' => $template ? $template->content : null ) ) . "\n";
      prompt: |
        Make the header navigation open its submenus on click instead of on hover.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const raw = (d.inspections || []).map(i => i.stdout).join('\n').match(/INSPECT_JSON=(.*)/);
            if (!raw) return { pass: false, score: 0, reason: `no header inspection: ${JSON.stringify(d.inspections || d.error).slice(0, 300)}` };
            const header = JSON.parse(raw[1]);
            const content = header.content || '';
            // WordPress 7.0 replaced the deprecated openSubmenusOnClick with submenuVisibility; accept either.
            const applied = /"openSubmenusOnClick"\s*:\s*true|"submenuVisibility"\s*:\s*"click"/.test(content);
            const kept = content.includes('Fresh bread daily since 1998');
            const segments = d.textSegments || [];
            const finalText = segments[segments.length - 1] || '';
            const mentions = /(template( part)?|database|site editor|saved) override|database|takes? precedence|saved (copy|version)|customi[sz](ed|ations?) (in|from|made in) the site editor|site editor (customi[sz]ations?|changes|edits|copy|version)/i.test(finalText);
            const asked = mentions && finalText.includes('?');
            const state = `rendered header (${header.source}, ${header.stylesheet}): submenus-on-click=${applied}, tagline=${kept}`;
            if (applied && kept) return { pass: true, score: 1, reason: `change reached the rendered header; ${state}` };
            if (asked && kept) return { pass: true, score: 1, reason: `agent stopped to ask about the Site Editor customization; ${state}` };
            if (!kept) return { pass: false, score: 0, reason: `the user's Site Editor customization was discarded${asked ? '' : ' without asking'}; ${state}` };
            return { pass: false, score: 0, reason: `change never reached the rendered header and the agent did not ask; ${state}; final reply: ${finalText.slice(0, 300)}` };
          });

  # STU-2155: colors saved in the Site Editor's Styles panel live in the
  # wp_global_styles post and win over theme.json. The seed saves a background,
  # a link color and a line height there, then asks for a different background.
  # Passes when the rendered background is the requested color with the saved
  # line height intact (the link color may fairly change for contrast), or when
  # the agent stops to ask about the saved styles. Fails when
  # the agent edits only theme.json (reporting success with nothing changed),
  # or wipes the user's saved styles without asking.
  - description: background change reaches Global Styles saved in the Site Editor
    vars:
      caseId: global-styles-db-override
      timeoutMs: 420000
      seed:
        activeSite:
          name: Crumb & Co
          files: *stu2155_theme_files
          wpCli:
            - [theme, activate, bakery]
            - - eval
              - |
                $id = WP_Theme_JSON_Resolver::get_user_global_styles_post_id();
                // Under WP-CLI there is no current user, so the post is created without its theme term.
                wp_set_object_terms( $id, get_stylesheet(), 'wp_theme' );
                $styles = array( 'color' => array( 'background' => '#f6efe4' ), 'typography' => array( 'lineHeight' => '1.7' ), 'elements' => array( 'link' => array( 'color' => array( 'text' => '#8a3b1f' ) ) ) );
                wp_update_post( array( 'ID' => $id, 'post_content' => wp_json_encode( array( 'version' => 3, 'isGlobalStylesUserThemeJSON' => true, 'styles' => $styles ) ) ) );
                $user = WP_Theme_JSON_Resolver::get_user_data()->get_raw_data();
                if ( '#f6efe4' !== ( $user['styles']['color']['background'] ?? null ) ) { echo 'SEED_ERROR: saved global styles are not applied'; }
          inspect:
            - - eval
              - |
                $merged = WP_Theme_JSON_Resolver::get_merged_data()->get_raw_data();
                $user = WP_Theme_JSON_Resolver::get_user_data()->get_raw_data();
                $resolve = function ( $value ) use ( $merged ) {
                	if ( is_string( $value ) && ( preg_match( '/^var:preset\|color\|([a-z0-9-]+)$/i', $value, $m ) || preg_match( '/^var\(--wp--preset--color--([a-z0-9-]+)\)$/i', $value, $m ) ) ) {
                		foreach ( (array) ( $merged['settings']['color']['palette'] ?? array() ) as $entries ) {
                			foreach ( (array) $entries as $entry ) {
                				if ( ( $entry['slug'] ?? '' ) === $m[1] ) {
                					return $entry['color'];
                				}
                			}
                		}
                	}
                	return $value;
                };
                $background = $merged['styles']['color']['background'] ?? null;
                echo 'INSPECT_JSON=' . wp_json_encode( array( 'background' => $resolve( $background ), 'rawBackground' => $background, 'userLineHeight' => $user['styles']['typography']['lineHeight'] ?? null ) ) . "\n";
      prompt: |
        Change the site background color to dark navy #1e2a44.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const raw = (d.inspections || []).map(i => i.stdout).join('\n').match(/INSPECT_JSON=(.*)/);
            if (!raw) return { pass: false, score: 0, reason: `no global styles inspection: ${JSON.stringify(d.inspections || d.error).slice(0, 300)}` };
            const styles = JSON.parse(raw[1]);
            const applied = String(styles.background || '').toLowerCase() === '#1e2a44';
            const kept = String(styles.userLineHeight) === '1.7';
            const segments = d.textSegments || [];
            const finalText = segments[segments.length - 1] || '';
            const mentions = /(global styles|user|database|site editor|saved) override|database|takes? precedence|custom styles|saved (styles|colou?rs?|in the site editor)|customi[sz](ed|ations?) (in|from|made in) the (site editor|styles panel)|site editor (customi[sz]ations?|changes|edits|styles)/i.test(finalText);
            const asked = mentions && finalText.includes('?');
            const state = `rendered background=${styles.background} (${styles.rawBackground}), saved line height=${styles.userLineHeight}`;
            if (applied && kept) return { pass: true, score: 1, reason: `change reached the rendered styles; ${state}` };
            if (asked && kept) return { pass: true, score: 1, reason: `agent stopped to ask about the saved Site Editor styles; ${state}` };
            if (!kept) return { pass: false, score: 0, reason: `the user's saved Site Editor styles were discarded${asked ? '' : ' without asking'}; ${state}` };
            return { pass: false, score: 0, reason: `change never reached the rendered styles and the agent did not ask; ${state}; final reply: ${finalText.slice(0, 300)}` };
          });


