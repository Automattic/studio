  # A plugin that gives AI agents its own abilities through the Abilities API
  # (wp-includes/abilities-api.php, WordPress 6.9). The seed records the
  # abilities the site already has; after the turn the inspection runs each new
  # one through its REST route (/wp-abilities/v1/abilities/<name>/run), with an
  # input made from its input schema: those that write as a visitor and as an
  # administrator, then the read-only ones, which must list the added book.
  - description: a plugin's abilities let an agent add a book and list it
    vars:
      caseId: abilities-plugin
      timeoutMs: 600000
      seed:
        activeSite:
          name: Chapter & Verse
          wpCli:
            - - eval
              - |
                update_option( 'eval_abilities_before', array_map( function ( $ability ) { return $ability->get_name(); }, wp_get_abilities() ), false );
          inspect:
            - - eval
              - |
                $book = 'The Left Hand of Darkness';
                $fill = function ( $schema ) use ( &$fill, $book ) {
                	$schema = (array) $schema;
                	if ( isset( $schema['enum'] ) ) { return $schema['enum'][0]; }
                	$type = (array) ( $schema['type'] ?? 'string' );
                	// An ability that takes no input declares it as null.
                	if ( array( 'null' ) === $type ) { return null; }
                	if ( in_array( 'object', $type, true ) ) {
                		$value = array();
                		foreach ( (array) ( $schema['properties'] ?? array() ) as $key => $property ) { $value[ $key ] = $fill( $property ); }
                		return $value;
                	}
                	if ( in_array( 'array', $type, true ) ) { return array(); }
                	if ( array_intersect( array( 'integer', 'number' ), $type ) ) { return max( 1, (int) ( $schema['minimum'] ?? 1 ) ); }
                	if ( in_array( 'boolean', $type, true ) ) { return false; }
                	$formats = array( 'date' => '2026-01-15', 'date-time' => '2026-01-15T10:00:00', 'email' => 'reader@example.com', 'uri' => 'https://example.com/', 'url' => 'https://example.com/' );
                	return $formats[ $schema['format'] ?? '' ] ?? $book;
                };
                $run = function ( $ability, $user ) use ( $fill ) {
                	wp_set_current_user( $user );
                	$annotations = (array) $ability->get_meta_item( 'annotations', array() );
                	$method = ! empty( $annotations['readonly'] ) ? 'GET' : ( ! empty( $annotations['destructive'] ) && ! empty( $annotations['idempotent'] ) ? 'DELETE' : 'POST' );
                	$request = new WP_REST_Request( $method, '/wp-abilities/v1/abilities/' . $ability->get_name() . '/run' );
                	$schema = $ability->get_input_schema();
                	$input = $schema ? $fill( $schema ) : null;
                	if ( 'POST' === $method ) {
                		$request->set_header( 'Content-Type', 'application/json' );
                		$request->set_body( wp_json_encode( array( 'input' => $input ) ) );
                	} elseif ( null !== $input ) {
                		$request->set_query_params( array( 'input' => $input ) );
                	}
                	$response = rest_do_request( $request );
                	return array( 'name' => $ability->get_name(), 'method' => $method, 'user' => $user, 'input' => $input, 'status' => $response->get_status(), 'body' => $response->get_data() );
                };
                $admins = get_users( array( 'role' => 'administrator', 'number' => 1, 'fields' => 'ID' ) );
                $admin = (int) ( $admins[0] ?? 1 );
                // The abilities the site had before the turn, recorded by the seed.
                $before = (array) get_option( 'eval_abilities_before', array() );
                $abilities = array_values( array_filter( wp_get_abilities(), function ( $ability ) use ( $before ) { return ! in_array( $ability->get_name(), $before, true ); } ) );
                $listed = array();
                foreach ( $abilities as $ability ) {
                	$listed[] = array( 'name' => $ability->get_name(), 'inRest' => (bool) $ability->get_meta_item( 'show_in_rest' ), 'annotations' => $ability->get_meta_item( 'annotations' ), 'inputSchema' => $ability->get_input_schema() );
                }
                $writes = array_filter( $abilities, function ( $ability ) { $a = (array) $ability->get_meta_item( 'annotations', array() ); return empty( $a['readonly'] ) && empty( $a['destructive'] ); } );
                $reads = array_filter( $abilities, function ( $ability ) { $a = (array) $ability->get_meta_item( 'annotations', array() ); return ! empty( $a['readonly'] ); } );
                $runs = array();
                foreach ( $writes as $ability ) { $runs[] = $run( $ability, 0 ); }
                foreach ( $writes as $ability ) { $runs[] = $run( $ability, $admin ); }
                foreach ( $reads as $ability ) { $runs[] = $run( $ability, $admin ); }
                echo 'INSPECT_JSON=' . wp_json_encode( array( 'book' => $book, 'abilities' => $listed, 'runs' => $runs ) ) . "\n";
      prompt: |
        Write a plugin for my book club's site that keeps our reading list,
        with a title and an author for each book. I want AI agents to be able
        to list the books and add new ones through the WordPress Abilities API.
    assert:
      - type: javascript
        value: file://outcome.mjs:siteWorks
      - type: javascript
        value: file://outcome.mjs:abilitiesWork
      - type: javascript
        value: file://outcome.mjs:otherSitesUntouched

  # The failures users report most (from user interviews and support reports).
  # Each case asks for something WordPress already does natively, the way a
  # user would ask, and passes only when the site the turn leaves behind uses
  # that native feature instead of custom code, CSS or raw HTML.
  # Each also has a tool call and token budget with headroom over five passing
  # runs, so a run that reaches the right result by looping fails. Mini-Cart's
  # normal runs took 23-36 tool calls; two that looped for 73-76 calls on a
  # block hidden by WooCommerce's Coming soon mode go over its budget.

  # A cart count is WooCommerce's Mini-Cart block, not hand-written fragments
