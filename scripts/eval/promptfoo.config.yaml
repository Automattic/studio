  # Regression (STU-2017): customizing a site running an installed third-party
  # theme used to edit that theme's files directly, so a theme update would
  # silently wipe the customizations. The agent must scaffold a child theme
  # (scaffold_theme with parentTheme) and keep every change inside it.
  - description: customizing an installed third-party theme creates a child theme and never edits the parent
    vars:
      caseId: child-theme-for-installed-theme
      timeoutMs: 600000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Child Theme Site" exists using
        site_list. If it does, delete it with site_delete so we start from a
        clean slate. Do NOT touch any other site.

        Then create a new site named "Eval Child Theme Site", install and
        activate the Ollie theme from the WordPress.org directory, and
        customize the design: make all headings a serif font and shift the
        color palette warmer. Keep it quick — only typography and color
        changes, no new pages or content.
    assert:
      # The agent must scaffold a child theme of ollie, successfully.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const call = (d.toolCalls || []).find(t => t.name === 'scaffold_theme' && t.input?.parentTheme === 'ollie');
            if (!call) {
              const scaffolds = (d.toolCalls || []).filter(t => t.name === 'scaffold_theme').map(t => t.input);
              return { pass: false, score: 0, reason: `no scaffold_theme call with parentTheme="ollie"; scaffold_theme calls: ${JSON.stringify(scaffolds)}` };
            }
            const result = (d.toolResults || []).find(r => r.toolUseId === call.id);
            if (!result || result.isError) {
              return { pass: false, score: 0, reason: `scaffold_theme(parentTheme=ollie) failed: ${JSON.stringify(result).slice(0, 300)}` };
            }
            return { pass: true, score: 1, reason: `child theme scaffolded: ${JSON.stringify(call.input)}` };
          });
      # No Write/Edit/Bash may touch the installed parent theme's files.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const offending = (d.toolCalls || []).filter(c => {
              const i = c.input || {};
              if (c.name === 'Write' || c.name === 'Edit') {
                return String(i.file_path || i.path || i.filePath || '').includes('/themes/ollie/');
              }
              if (c.name === 'Bash') {
                // Reads are fine; catch anything that could mutate the parent.
                return /themes\/ollie\//.test(i.command || '') && /\b(>|>>|sed\s+-i|mv|cp|rm|tee|touch)\b/.test(i.command || '');
              }
              return false;
            });
            if (offending.length > 0) {
              return { pass: false, score: 0, reason: `${offending.length} call(s) modified the installed parent theme (first: ${JSON.stringify({ name: offending[0].name, input: offending[0].input }).slice(0, 300)})` };
            }
            return { pass: true, score: 1, reason: 'no Write/Edit/Bash mutation under themes/ollie/' };
          });

  # When adding sections to a site that already has an active theme, the agent
  # should color them from the theme's color palette (block color-slug
  # attributes like {"backgroundColor":"accent-1"} or var(--wp--preset--color--*)
  # in CSS) instead of hardcoding hex values. Hardcoded hex detaches the section
  # from Global Styles / theme switching / dark variations and is the behavior
  # this case guards against. theme.json is excluded from the hex check because
  # the palette is legitimately *defined* there with hex.
  - description: added sections use the theme color palette, not hardcoded hex
    vars:
      caseId: section-uses-theme-palette
      timeoutMs: 600000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Palette Site" exists using
        site_list. If it does, delete it with site_delete so we start from a
        clean slate. Do NOT touch any other site.

        Then create a new site named "Eval Palette Site". Keep its current
        default theme — do not create, scaffold, or switch themes.

        Add two visually distinct sections to the site's homepage: a hero
        section with a colored background and a heading, and a call-to-action
        section with a contrasting colored background and a button. Make the
        colors feel cohesive with the site's existing theme.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const calls = d.toolCalls || [];
            const pathOf = (i) => String((i && (i.file_path || i.path || i.filePath)) || '').toLowerCase();
            // Collect every place a color can land. Block markup and theme CSS
            // reach the site through Write/Edit (a scratch .html, style.css, or
            // raw block markup) OR through wp_cli — both as post_content and as
            // CSS injected via `wp_cli eval '$css = "..."'`. theme.json is the one
            // exclusion: a palette is legitimately defined there with hex.
            const blobs = [];
            for (const c of calls) {
              const i = c.input || {};
              if ((c.name === 'Write' || c.name === 'Edit') && !pathOf(i).endsWith('.json')) {
                for (const k of ['content', 'new_string', 'replacement', 'text']) {
                  if (typeof i[k] === 'string') blobs.push(i[k]);
                }
                // The Edit tool applies changes as { edits: [{ oldText, newText }] }.
                if (Array.isArray(i.edits)) {
                  for (const e of i.edits) if (e && typeof e.newText === 'string') blobs.push(e.newText);
                }
              }
              if (c.name === 'wp_cli' && typeof i.command === 'string') {
                blobs.push(i.command);
              }
            }
            const markup = blobs.join('\n');
            if (!/<!--\s*wp:/.test(markup)) {
              return { pass: false, score: 0, reason: `no block markup found in Write/wp_cli calls; tool calls: ${JSON.stringify(calls.map(c => c.name))}` };
            }
            // Hardcoded hex colors in section markup / theme CSS = custom colors (the bug).
            const hex = markup.match(/#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b/g) || [];
            // Palette references: block color-slug attributes or preset CSS vars.
            const slugAttr = markup.match(/"(?:backgroundColor|textColor|borderColor|overlayColor|gradient)"\s*:\s*"[a-z][a-z0-9-]*"/g) || [];
            const presetVar = markup.match(/var\(\s*--wp--preset--color--[a-z0-9-]+/g) || [];
            const paletteRefs = slugAttr.length + presetVar.length;
            if (hex.length > 0) {
              const uniq = [...new Set(hex)].slice(0, 8);
              return { pass: false, score: 0, reason: `section markup/CSS hardcodes ${hex.length} custom hex color(s) (${uniq.join(', ')}) instead of theme palette colors; palette refs found: ${paletteRefs}` };
            }
            if (paletteRefs === 0) {
              return { pass: false, score: 0, reason: `sections apply no theme-palette colors (no color-slug attributes or --wp--preset--color-- vars) — cannot confirm the section is colored from the palette` };
            }
            return { pass: true, score: 1, reason: `sections colored from the theme palette (${paletteRefs} palette color ref(s)) with no hardcoded hex` };
          });

  # Regression: shrink-wrapped labels (eyebrows, badges, pills) used to be
  # styled with `display: inline-block` on the block wrapper class. Constrained
  # layouts align children with `margin-left/right: auto !important`, which only
  # works on block-level boxes, so the label escapes the content column and hugs
  # the edge of the full-width section. The fix is a flex row group wrapper (or
  # styling an inner element) — never a display override on the block wrapper.
  # The prompt deliberately elicits the pattern: a pill label above a hero
  # heading is the canonical case where the agent reaches for inline-block.
  - description: hero eyebrow pill keeps content-column alignment (no inline-block on block wrappers)
    vars:
      caseId: inline-block-constrained-alignment
      timeoutMs: 600000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Eyebrow Site" exists using
        site_list. If it does, delete it with site_delete so we start from a
        clean slate. Do NOT touch any other site.

        Then build a simple one-page site named "Eval Eyebrow Site". The
        homepage needs a full-width hero section whose content stays in the
        normal content column, containing: a small uppercase eyebrow label
        styled as a pill (rounded background that hugs the text) sitting
        above the main heading, the main heading, and a short subtitle.
        Keep the rest of the page minimal — no extra sections needed.
    assert:
      # Collect everything the agent wrote (block markup + theme CSS) and fail
      # if any CSS rule sets an inline-level `display` on a bare block-wrapper
      # class — i.e. a selector that is exactly `.foo` where `foo` appears in a
      # block `className` attribute. Descendant selectors (`.foo span`) and
      # classes never used on blocks are fine.
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const blobs = [];
            for (const c of d.toolCalls || []) {
              const i = c.input || {};
              if (c.name === 'Write' || c.name === 'Edit') {
                for (const k of ['content', 'new_string', 'replacement', 'text']) {
                  if (typeof i[k] === 'string') blobs.push(i[k]);
                }
                if (Array.isArray(i.edits)) {
                  for (const e of i.edits) if (e && typeof e.newText === 'string') blobs.push(e.newText);
                }
              }
              if (c.name === 'wp_cli' && typeof i.command === 'string') blobs.push(i.command);
            }
            const all = blobs.join('\n');
            if (!/<!--\s*wp:/.test(all)) {
              return { pass: false, score: 0, reason: `no block markup found in Write/Edit/wp_cli calls; tools: ${JSON.stringify((d.toolCalls || []).map(t => t.name))}` };
            }
            // Class names used on block wrappers via the className attribute.
            const blockClasses = new Set();
            for (const m of all.matchAll(/"className"\s*:\s*"([^"]+)"/g)) {
              for (const cls of m[1].split(/\s+/)) if (cls) blockClasses.add(cls);
            }
            // CSS rules that set an inline-level display. Strip CSS comments
            // first so an anchor comment before a rule can't pollute the
            // selector text and mask a match.
            const scrubbed = all.replace(/\/\*[\s\S]*?\*\//g, ' ');
            const offenders = [];
            for (const m of scrubbed.matchAll(/([^{}]+)\{([^{}]*display\s*:\s*inline(?:-block|-flex|-grid|-table)?(?![\w-])[^{}]*)\}/g)) {
              for (const sel of m[1].split(',')) {
                const bare = sel.trim().match(/^\.([A-Za-z0-9_-]+)$/);
                if (bare && blockClasses.has(bare[1])) {
                  offenders.push(`.${bare[1]} { ${m[2].trim().slice(0, 120)} }`);
                }
              }
            }
            if (offenders.length > 0) {
              return { pass: false, score: 0, reason: `${offenders.length} block-wrapper class(es) styled with an inline-level display, which breaks constrained-layout alignment: ${offenders.slice(0, 3).join(' | ')}` };
            }
            return { pass: true, score: 1, reason: `no inline-level display on block-wrapper classes (${blockClasses.size} block classes checked)` };
          });

  # A visual treatment repeated across instances of one block type should be a
  # registered block style variation (register_block_style + is-style-<slug>),
  # not a bare custom class styled only in CSS. Variations show up in the
  # editor's Styles switcher, so users can restyle without touching CSS — the
  # behavior this case guards is the agent reaching for custom CSS first.
  - description: repeated card treatment uses a registered block style variation
    vars:
      caseId: repeated-treatment-uses-block-style
      timeoutMs: 600000
      askUserPolicy: allow_all
      prompt: |
        First check if a site named "Eval Block Style Site" exists using
        site_list. If it does, delete it with site_delete so we start from a
        clean slate. Do NOT touch any other site.

        Then create a new site named "Eval Block Style Site" and build a simple
        homepage for a coffee shop with a fresh scaffolded theme. The homepage
        must include a features section of three cards that all share the same
        visual treatment: same background, border radius, padding, and shadow.
    assert:
      - type: javascript
        value: |
          return import('node:fs').then(({ readFileSync }) => {
            const marker = output.split(/\r?\n/).map(l => l.trim()).find(l => l.startsWith('EVAL_RUNNER_RESULT_FILE='));
            if (!marker) return { pass: false, score: 0, reason: `no result-file marker on stdout; got: ${output.slice(0, 200)}` };
            const d = JSON.parse(readFileSync(marker.slice('EVAL_RUNNER_RESULT_FILE='.length), 'utf8'));
            const calls = d.toolCalls || [];
            const pathOf = (i) => String((i && (i.file_path || i.path || i.filePath)) || '').toLowerCase();
            const blobs = [];
            const styleJsonPaths = [];
            for (const c of calls) {
              const i = c.input || {};
              if (c.name === 'Write' || c.name === 'Edit') {
                for (const k of ['content', 'new_string', 'replacement', 'text']) {
                  if (typeof i[k] === 'string') blobs.push(i[k]);
                }
                if (Array.isArray(i.edits)) {
                  for (const e of i.edits) if (e && typeof e.newText === 'string') blobs.push(e.newText);
                }
                if (/\/styles\/.*\.json$/.test(pathOf(i))) styleJsonPaths.push(pathOf(i));
              }
              if (c.name === 'wp_cli' && typeof i.command === 'string') blobs.push(i.command);
            }
            const markup = blobs.join('\n');
            if (!/<!--\s*wp:/.test(markup)) {
              return { pass: false, score: 0, reason: `no block markup found in Write/Edit/wp_cli calls; tool calls: ${JSON.stringify(calls.map(c => c.name))}` };
            }
            // Registration: register_block_style() in PHP, or a theme styles/*.json
            // block-style file (WP 6.6+) declaring blockTypes.
            const registeredPhp = /register_block_style\s*\(/.test(markup);
            const registeredJson = styleJsonPaths.length > 0 && /"blockTypes"/.test(markup);
            // Application: an is-style-<slug> class on the card blocks, used more
            // than once (the treatment is repeated). Exclude core built-in slugs
            // so e.g. is-style-rounded on an image doesn't count as the cards'.
            const coreSlugs = new Set(['default', 'fill', 'outline', 'rounded', 'plain', 'pill-shape', 'large', 'checkmark-list']);
            const applied = (markup.match(/is-style-[a-z0-9-]+/g) || []).filter(s => !coreSlugs.has(s.slice('is-style-'.length)));
            if (!registeredPhp && !registeredJson) {
              return { pass: false, score: 0, reason: `no block style variation registered (no register_block_style call and no styles/*.json block-style file) — the repeated card treatment was styled some other way (is-style uses found: ${applied.length})` };
            }
            if (applied.length < 2) {
              return { pass: false, score: 0, reason: `a block style variation was registered but applied ${applied.length} time(s) — the repeated card treatment does not use it` };
            }
            // Preset-first applies to sizes too: a raw fontSize value repeated
            // across blocks belongs in theme.json's size scale as a preset slug.
            const rawSizes = markup.match(/"fontSize"\s*:\s*"\d[^"]*"/g) || [];
            const sizeCounts = {};
            for (const s of rawSizes) sizeCounts[s] = (sizeCounts[s] || 0) + 1;
            const repeatedSizes = Object.entries(sizeCounts).filter(([, n]) => n >= 3).map(([s, n]) => `${s} x${n}`);
            if (repeatedSizes.length > 0) {
              return { pass: false, score: 0, reason: `raw font-size value(s) repeated across blocks instead of a theme.json size preset: ${repeatedSizes.join(', ')}` };
            }
            return { pass: true, score: 1, reason: `repeated card treatment uses a registered block style variation (${registeredPhp ? 'register_block_style' : 'styles/*.json'}; applied ${applied.length} times: ${[...new Set(applied)].join(', ')}); no raw font-size repeated ${'>'}= 3 times` };
          });
