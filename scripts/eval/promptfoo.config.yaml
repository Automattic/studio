            if (!r) return { pass: false, score: 0, reason: `preview_list was not called; tools: ${JSON.stringify((d.toolCalls || []).map(t => t.name))}` };
            const ok = /"type"\s*:\s*"preview"/.test(r.text || '');
            return { pass: ok, score: ok ? 1 : 0, reason: ok ? 'preview output tagged type=preview' : `missing type discriminator: ${(r.text || '').slice(0, 300)}` };
          });
      # A behavioral llm-rubric assertion used to grade the assistant's prose
      # here — that it keeps preview and connected-remote sites in distinct
      # categories. It was removed because the WP.com AI proxy's Studio lane now
      # rejects the grader's plain judge call (no agent envelope/identity), and
      # the honest fix (a dedicated eval-grader feature slug from #ai-ops, or an
      # ANTHROPIC_API_KEY-backed grader) is not yet in place. The two
      # assertions above still guard the tool-output discriminators. Restore the
      # prose guard once the grader can authenticate.

