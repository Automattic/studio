          wpCli:
            - - eval
              - |
                $images = ABSPATH . 'old-site/images';
                wp_mkdir_p( $images );
                $theme = get_theme_root() . '/twentytwentyfive/assets/images';
                if ( ! copy( "$theme/hero-podcast.webp", "$images/harbor.webp" ) || ! copy( "$theme/book-image.webp", "$images/crew.webp" ) ) { echo 'SEED_ERROR: could not copy the photos'; }
      prompt: |
        I've had a hand-coded HTML site for years and I'm tired of editing the
        files by hand. They're in the old-site folder in my Studio site. Can you
        move it onto WordPress so I can edit it myself?
